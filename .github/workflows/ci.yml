name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hygiene:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up prek
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.5"
          install_args: prek
      - run: prek validate-config prek.toml
      - run: prek run --all-files --group hygiene --show-diff-on-failure

  web:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.5"
          install_args: node
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci
        working-directory: frontend
      - run: npm run verify:web
        working-directory: frontend

  server:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Java
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.5"
          install_args: java
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: chmod +x server/gradlew
      - run: ./gradlew --no-daemon check :api:bootJar :worker:bootJar
        working-directory: server
      - name: Validate production Compose
        working-directory: server
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder
        run: |
          if grep -Eq '\$\{[A-Z0-9_]+:-' deploy/compose.production.yml; then
            echo 'Production Compose must not define fallback values.' >&2
            exit 1
          fi
          docker compose --env-file deploy/.env.production.example -f deploy/compose.production.yml --profile quick-tunnel config --quiet
          if LAUNDRY_SOURCE_URL= docker compose --env-file deploy/.env.production.example -f deploy/compose.production.yml config --quiet >/dev/null 2>&1; then
            echo 'Production Compose accepted an empty LAUNDRY_SOURCE_URL.' >&2
            exit 1
          fi
      - name: Build API image
        run: docker build --target api-runtime --file server/Dockerfile .
      - name: Build Worker image
        run: docker build --target worker-runtime --file server/Dockerfile .

  desktop:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      JUNGLE_BELL_DATA_API_URL: https://jungle-bell.sijun-yang.com
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js and Rust
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.5"
          install_args: node rust
          cache: false
      - name: Ensure Rust components
        run: rustup component add --toolchain stable rustfmt clippy
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          cache-on-failure: false
      - run: npm ci
        working-directory: frontend
      - run: npm run verify:desktop
        working-directory: frontend

  required:
    name: required
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [hygiene, web, server, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          WEB_RESULT: ${{ needs.web.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          test "$HYGIENE_RESULT" = "success"
          test "$WEB_RESULT" = "success"
          test "$SERVER_RESULT" = "success"
          test "$DESKTOP_RESULT" = "success"
