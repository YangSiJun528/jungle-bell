name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run verify:web
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: app-assets
          path: frontend/dist/web
          retention-days: 1

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x server/gradlew
      - run: ./gradlew --no-daemon check :api:bootJar :worker:bootJar
        working-directory: server
      - name: Validate production Compose
        working-directory: server
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder
        run: docker compose --env-file deploy/.env.production.example -f deploy/compose.production.yml --profile quick-tunnel config --quiet
      - name: Build API image
        run: docker build --target api-runtime --file server/Dockerfile .
      - name: Build Worker image
        run: docker build --target worker-runtime --file server/Dockerfile .

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JUNGLE_BELL_DATA_API_URL: https://jungle-bell.sijun-yang.com
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          cache-on-failure: false
      - run: npm ci
        working-directory: frontend
      - run: npm run verify:desktop
        working-directory: frontend
