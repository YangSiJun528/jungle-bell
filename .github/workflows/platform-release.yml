name: Platform Release
run-name: Platform release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "platform-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable release tag (for example platform-v0.5.0)"
        required: true
        type: string
      ref:
        description: "Commit, branch, or tag to release; defaults to the triggering commit"
        required: false
        type: string
      app_origin:
        description: "HTTPS web app origin; defaults to repository variable JB_APP_ORIGIN"
        required: false
        type: string
      api_origin:
        description: "HTTPS API origin; defaults to repository variable JB_API_ORIGIN"
        required: false
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: false
        type: boolean

concurrency:
  group: platform-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  prepare:
    name: Validate immutable release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      api_origin: ${{ steps.release.outputs.api_origin }}
      app_origin: ${{ steps.release.outputs.app_origin }}
      image: ${{ steps.release.outputs.image }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable GitHub releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETTINGS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::RELEASE_SETTINGS_READ_TOKEN is required."
            exit 1
          fi
          if ! immutable_releases="$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/immutable-releases" \
              --jq '.enabled'
          )"; then
            echo "::error::Enable immutable releases for this repository before publishing."
            exit 1
          fi
          if [[ "$immutable_releases" != "true" ]]; then
            echo "::error::Immutable releases must be enabled before publishing."
            exit 1
          fi

      - name: Resolve and validate release metadata
        id: release
        env:
          DISPATCH_API_ORIGIN: ${{ inputs.api_origin }}
          DISPATCH_APP_ORIGIN: ${{ inputs.app_origin }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
          DISPATCH_REF: ${{ inputs.ref }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REPOSITORY_API_ORIGIN: ${{ vars.JB_API_ORIGIN }}
          REPOSITORY_APP_ORIGIN: ${{ vars.JB_APP_ORIGIN }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          else
            tag="$DISPATCH_TAG"
            requested_ref="${DISPATCH_REF:-$GITHUB_SHA}"
            requested_sha="$(git rev-parse "${requested_ref}^{commit}")"
            existing_tag_sha="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
            if [[ -n "$existing_tag_sha" ]]; then
              if [[ -n "$DISPATCH_REF" && "$existing_tag_sha" != "$requested_sha" ]]; then
                echo "::error::The existing tag does not point to the requested ref."
                exit 1
              fi
              sha="$existing_tag_sha"
            else
              sha="$requested_sha"
            fi
          fi

          if [[ ! "$tag" =~ ^platform-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::The tag must match platform-vMAJOR.MINOR.PATCH[-PRERELEASE]."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          git checkout --detach "$sha"
          package_version="$(node -p "require('./platform/package.json').version")"
          tauri_version="$(node -p "require('./platform/apps/desktop/src-tauri/tauri.conf.json').version")"
          cargo_version="$(
            sed -nE 's/^version = "([^"]+)"$/\1/p' \
              platform/apps/desktop/src-tauri/Cargo.toml |
              head -n 1
          )"
          if [[ "$version" != "$package_version" ||
                "$version" != "$tauri_version" ||
                "$version" != "$cargo_version" ]]; then
            echo "::error::Tag, platform package, Tauri config, and Cargo versions must match."
            exit 1
          fi

          app_origin="${DISPATCH_APP_ORIGIN:-$REPOSITORY_APP_ORIGIN}"
          api_origin="${DISPATCH_API_ORIGIN:-$REPOSITORY_API_ORIGIN}"
          normalized_origins="$(
            APP_ORIGIN="$app_origin" API_ORIGIN="$api_origin" node <<'NODE'
          const values = [
            ["JB_APP_ORIGIN", process.env.APP_ORIGIN],
            ["JB_API_ORIGIN", process.env.API_ORIGIN],
          ];
          const normalized = values.map(([name, raw]) => {
            if (!raw) throw new Error(`${name} is required`);
            const value = new URL(raw);
            if (
              value.protocol !== "https:" ||
              value.username ||
              value.password ||
              value.pathname !== "/" ||
              value.search ||
              value.hash
            ) {
              throw new Error(`${name} must be an HTTPS origin without credentials, path, query, or fragment`);
            }
            return value.origin;
          });
          if (normalized[0] !== normalized[1]) {
            throw new Error("JB_APP_ORIGIN and JB_API_ORIGIN must be the same production origin");
          }
          process.stdout.write(`${normalized[0]}\n${normalized[1]}\n`);
          NODE
          )"
          app_origin="$(sed -n '1p' <<<"$normalized_origins")"
          api_origin="$(sed -n '2p' <<<"$normalized_origins")"

          prerelease=false
          if [[ "$version" == *-* ||
                ("$GITHUB_EVENT_NAME" == "workflow_dispatch" &&
                 "$DISPATCH_PRERELEASE" == "true") ]]; then
            prerelease=true
          fi

          repository_lower="$(
            tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY"
          )"
          {
            echo "api_origin=$api_origin"
            echo "app_origin=$app_origin"
            echo "image=ghcr.io/${repository_lower}-platform-server"
            echo "prerelease=$prerelease"
            echo "sha=$sha"
            echo "tag=$tag"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  quality:
    name: Release quality gate
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: platform

    steps:
      - name: Check out immutable revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: platform/apps/desktop/src-tauri -> target
          cache-on-failure: false

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: platform/apps/desktop/src-tauri

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Verify platform
        run: npm run verify

      - name: Run deterministic 200-user smoke
        run: npm run smoke:platform

      - name: Build and exercise the production container
        run: npm run smoke:container

      - name: Scan the production container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: "1"
          format: table
          image-ref: jungle-bell-platform:smoke
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          vuln-type: os,library

  draft-release:
    name: Create draft release
    needs:
      - prepare
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}

    steps:
      - name: Create or reuse an unpublished draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          if existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>/dev/null)"; then
            if [[ "$(jq -r '.draft' <<<"$existing")" != "true" ]]; then
              echo "::error::A published release already exists for $RELEASE_TAG."
              exit 1
            fi
            release_id="$(jq -r '.id' <<<"$existing")"
          else
            release_id="$(
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$RELEASE_TAG" \
                -f target_commitish="$RELEASE_SHA" \
                -f name="Jungle Bell Platform $RELEASE_VERSION" \
                -F draft=true \
                -F prerelease="$PRERELEASE" \
                -F generate_release_notes=true \
                --jq '.id'
            )"
          fi

          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"

  desktop:
    name: Desktop ${{ matrix.name }}
    needs:
      - prepare
      - draft-release
    strategy:
      fail-fast: false
      # tauri-action merges latest.json by replacing one release asset, so
      # updater-producing jobs must not race each other.
      max-parallel: 1
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            runner: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64 NSIS
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out immutable revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: platform/apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
          cache-on-failure: false

      - name: Install locked dependencies
        working-directory: platform
        run: npm ci

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Require Tauri updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required."
            exit 1
          fi

      - name: Import and select Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for a notarized macOS release."
              exit 1
            fi
          done

          certificate="$RUNNER_TEMP/jungle-bell-developer-id.p12"
          keychain="$RUNNER_TEMP/jungle-bell-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode >"$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain" |
              awk -F'"' '/Developer ID Application/ { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::The certificate does not contain a Developer ID Application identity."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >>"$GITHUB_ENV"

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @(
            "WINDOWS_CERTIFICATE",
            "WINDOWS_CERTIFICATE_PASSWORD",
            "WINDOWS_TIMESTAMP_URL"
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "$name is required for an Authenticode-signed Windows release."
            }
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "jungle-bell-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
            -String $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText `
            -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          if ($null -eq $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
            throw "The Windows signing certificate could not be imported."
          }

          $config = @{
            bundle = @{
              createUpdaterArtifacts = $true
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content `
            -Path "platform/apps/desktop/tauri.release.conf.json" `
            -Value $config `
            -Encoding utf8

      - name: Configure signed macOS and Linux updater artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node -e '
            require("node:fs").writeFileSync(
              "platform/apps/desktop/tauri.release.conf.json",
              JSON.stringify({ bundle: { createUpdaterArtifacts: true } }),
            );
          '

      - name: Build, sign, and upload Tauri bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && vars.APPLE_TEAM_ID || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JB_API_ORIGIN: ${{ needs.prepare.outputs.api_origin }}
          JB_APP_ORIGIN: ${{ needs.prepare.outputs.app_origin }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            --config tauri.release.conf.json
            --ci
          projectPath: platform/apps/desktop
          releaseId: ${{ needs.draft-release.outputs.release_id }}
          retryAttempts: 2
          tagName: ${{ needs.prepare.outputs.tag }}
          tauriScript: npm exec -- tauri
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Verify macOS code signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(
            find "platform/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" \
              -maxdepth 1 \
              -name '*.app' \
              -print \
              -quit
          )"
          if [[ -z "$app" ]]; then
            echo "::error::The macOS application bundle was not found."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          find "${app}.tar.gz.sig" -type f -size +0 -print -quit | grep -q .

      - name: Verify Windows Authenticode and updater signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = "platform/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundle -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "The NSIS installer was not found."
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "The NSIS Authenticode signature is not valid: $($signature.Status)"
          }
          $updaterSignature = Get-ChildItem -Path $bundle -Filter "*.sig" | Select-Object -First 1
          if ($null -eq $updaterSignature -or $updaterSignature.Length -eq 0) {
            throw "The NSIS updater signature was not generated."
          }

      - name: Verify Linux bundles and updater signatures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="platform/apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$bundle_root/appimage" -maxdepth 1 -name '*.AppImage' -type f -size +0 -print -quit |
            grep -q .
          find "$bundle_root/deb" -maxdepth 1 -name '*.deb' -type f -size +0 -print -quit |
            grep -q .
          find "$bundle_root" -name '*.sig' -type f -size +0 -print -quit |
            grep -q .

  server-image:
    name: Publish multi-architecture server image
    needs:
      - prepare
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out immutable revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=sha-${{ needs.prepare.outputs.sha }}

      - name: Build and push immutable image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          cache-from: type=gha,scope=platform-release
          cache-to: type=gha,mode=max,scope=platform-release
          context: platform
          file: platform/Dockerfile
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}

      - name: Attest server image provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-name: ${{ needs.prepare.outputs.image }}
          push-to-registry: true

  publish:
    name: Publish completed release
    needs:
      - prepare
      - draft-release
      - desktop
      - server-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out immutable revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install updater verifier system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Prepare updater trust-root verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          verification_root="$RUNNER_TEMP/jungle-bell-updater-verification"
          assets_path="$verification_root/release-assets.json"
          manifest_path="$verification_root/latest.json"
          plan_path="$verification_root/verification-plan.json"
          mkdir -p "$verification_root"

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            >"$assets_path"
          asset_count="$(jq 'length' "$assets_path")"
          if [[ "$asset_count" -ge 100 ]]; then
            echo "::error::Release asset pagination is not allowed."
            exit 1
          fi
          manifest_count="$(
            jq '[.[] | select(
              .name == "latest.json" and
              .state == "uploaded" and
              .size > 0
            )] | length' "$assets_path"
          )"
          if [[ "$manifest_count" -ne 1 ]]; then
            echo "::error::Exactly one non-empty latest.json release asset is required."
            exit 1
          fi
          manifest_asset_id="$(
            jq -r '.[] | select(
              .name == "latest.json" and
              .state == "uploaded" and
              .size > 0
            ) | .id' \
              "$assets_path"
          )"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$manifest_asset_id" \
            >"$manifest_path"

          node platform/scripts/verify-updater-manifest.mjs \
            --manifest "$manifest_path" \
            --assets "$assets_path" \
            --tauri-config platform/apps/desktop/src-tauri/tauri.conf.json \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --output "$plan_path"
          {
            echo "UPDATER_MANIFEST_ASSET_ID=$manifest_asset_id"
            echo "UPDATER_MANIFEST_PATH=$manifest_path"
            echo "UPDATER_VERIFICATION_PLAN=$plan_path"
          } >>"$GITHUB_ENV"

      - name: Verify every updater artifact against the embedded public key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          public_key_path="$(
            jq -r '.publicKeyPath' "$UPDATER_VERIFICATION_PLAN"
          )"
          verified_platforms=0
          while IFS=$'\t' read -r \
            platform_name \
            artifact_asset_id \
            artifact_path \
            artifact_digest \
            signature_asset_id \
            release_signature_path \
            release_signature_digest \
            manifest_signature_path \
            decoded_signature_path; do
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$artifact_asset_id" \
              >"$artifact_path"
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$signature_asset_id" \
              >"$release_signature_path"
            read -r artifact_sha256 _ < <(sha256sum "$artifact_path")
            if [[ "sha256:$artifact_sha256" != "$artifact_digest" ]]; then
              echo "::error::Downloaded artifact digest differs for $platform_name."
              exit 1
            fi
            read -r release_signature_sha256 _ < <(
              sha256sum "$release_signature_path"
            )
            if [[ "sha256:$release_signature_sha256" != "$release_signature_digest" ]]; then
              echo "::error::Downloaded signature digest differs for $platform_name."
              exit 1
            fi
            if ! cmp --silent \
              "$manifest_signature_path" \
              "$release_signature_path"; then
              echo "::error::Manifest and detached signature differ for $platform_name."
              exit 1
            fi
            cargo run \
              --quiet \
              --locked \
              --manifest-path platform/apps/desktop/src-tauri/Cargo.toml \
              --example verify_updater_signature \
              -- \
              "$public_key_path" \
              "$artifact_path" \
              "$decoded_signature_path"
            verified_platforms=$((verified_platforms + 1))
          done < <(
            jq -r '.platforms[] | [
              .platform,
              .artifact.assetId,
              .artifact.outputPath,
              .artifact.digest,
              .releaseSignature.assetId,
              .releaseSignature.outputPath,
              .releaseSignature.digest,
              .manifestSignaturePath,
              .decodedSignaturePath
            ] | @tsv' "$UPDATER_VERIFICATION_PLAN"
          )
          if [[ "$verified_platforms" -ne 3 ]]; then
            echo "::error::Exactly three required updater platforms must verify."
            exit 1
          fi

      - name: Publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_SETTINGS_READ_TOKEN: ${{ secrets.RELEASE_SETTINGS_READ_TOKEN }}
          RELEASE_ID: ${{ needs.draft-release.outputs.release_id }}
        run: |
          set -euo pipefail

          fresh_assets_path="$RUNNER_TEMP/jungle-bell-updater-assets-before-publish.json"
          fresh_manifest_path="$RUNNER_TEMP/jungle-bell-latest-before-publish.json"
          gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            >"$fresh_assets_path"
          fresh_asset_count="$(jq 'length' "$fresh_assets_path")"
          if [[ "$fresh_asset_count" -ge 100 ]]; then
            echo "::error::Release asset pagination is not allowed."
            exit 1
          fi
          manifest_match_count="$(
            jq --argjson id "$UPDATER_MANIFEST_ASSET_ID" \
              '[.[] | select(
                .id == $id and
                .name == "latest.json" and
                .state == "uploaded" and
                .size > 0
              )] | length' \
              "$fresh_assets_path"
          )"
          manifest_name_count="$(
            jq '[.[] | select(.name == "latest.json")] | length' \
              "$fresh_assets_path"
          )"
          if [[ "$manifest_match_count" -ne 1 || "$manifest_name_count" -ne 1 ]]; then
            echo "::error::The verified latest.json asset changed before publish."
            exit 1
          fi
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$UPDATER_MANIFEST_ASSET_ID" \
            >"$fresh_manifest_path"
          if ! cmp --silent "$UPDATER_MANIFEST_PATH" "$fresh_manifest_path"; then
            echo "::error::The verified latest.json bytes changed before publish."
            exit 1
          fi

          checked_assets=0
          while IFS=$'\t' read -r asset_id asset_name asset_size asset_digest; do
            asset_match_count="$(
              jq \
                --argjson id "$asset_id" \
                --arg name "$asset_name" \
                --argjson size "$asset_size" \
                --arg digest "$asset_digest" \
                '[.[] | select(
                  .id == $id and
                  .name == $name and
                  .size == $size and
                  .digest == $digest and
                  .state == "uploaded"
                )] | length' \
                "$fresh_assets_path"
            )"
            asset_name_count="$(
              jq --arg name "$asset_name" \
                '[.[] | select(.name == $name)] | length' \
                "$fresh_assets_path"
            )"
            if [[ "$asset_match_count" -ne 1 || "$asset_name_count" -ne 1 ]]; then
              echo "::error::A verified updater asset changed before publish."
              exit 1
            fi
            checked_assets=$((checked_assets + 1))
          done < <(
            jq -r '.platforms[] | [
              [
                .artifact.assetId,
                .artifact.name,
                .artifact.size,
                .artifact.digest
              ],
              [
                .releaseSignature.assetId,
                .releaseSignature.name,
                .releaseSignature.size,
                .releaseSignature.digest
              ]
            ][] | @tsv' "$UPDATER_VERIFICATION_PLAN"
          )
          if [[ "$checked_assets" -ne 6 ]]; then
            echo "::error::Exactly six updater assets must remain verified."
            exit 1
          fi

          if [[ -z "$RELEASE_SETTINGS_READ_TOKEN" ]]; then
            echo "::error::RELEASE_SETTINGS_READ_TOKEN is required."
            exit 1
          fi
          if ! immutable_releases="$(
            GH_TOKEN="$RELEASE_SETTINGS_READ_TOKEN" gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/immutable-releases" \
              --jq '.enabled'
          )"; then
            echo "::error::Immutable releases must still be enabled before publish."
            exit 1
          fi
          if [[ "$immutable_releases" != "true" ]]; then
            echo "::error::Immutable releases were disabled before publish."
            exit 1
          fi

          make_latest="false"
          if [[ "$PRERELEASE" != "true" ]]; then
            make_latest="true"
          fi
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease="$PRERELEASE" \
            -f make_latest="$make_latest" \
            >/dev/null
