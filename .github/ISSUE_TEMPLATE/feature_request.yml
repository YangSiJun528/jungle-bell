name: "기능 개선 건의"
description: "이런 기능이 있으면 좋겠다! 아이디어를 들려주세요."
labels: ["기능_개선_건의"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: "어떤 기능을 원하시나요?"
      description: "추가되거나 개선됐으면 하는 기능을 설명해 주세요."
      placeholder: |
        예: 세탁 종료 전에 원하는 시간만큼 미리 알림을 받을 수 있으면 좋겠어요.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "왜 필요한가요? (선택)"
      description: "이 기능이 어떤 상황에서 도움이 될지 알려주시면 우선순위 판단에 참고할게요."
      placeholder: |
        예: 세탁실까지 이동할 시간을 미리 확보하고 싶어서요.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: "현재 대안 (선택)"
      description: "지금은 어떻게 해결하고 계신가요?"
      placeholder: |
        예: 종료 시간을 직접 계산해 휴대폰 알람을 설정하고 있어요.
    validations:
      required: false
