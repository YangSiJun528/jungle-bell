# GitHub 공식 Discussion category form 문법:
# https://docs.github.com/discussions/managing-discussions-for-your-community/syntax-for-discussion-category-forms
# Announcements 카테고리에서 작성하면 `소식` 라벨이 자동으로 붙어 앱 피드에 게시된다.
title: ""
labels: ["소식"]
body:
  - type: markdown
    attributes:
      value: |
        이 글은 Jungle Bell 앱의 **소식** 탭에도 표시됩니다.

  - type: textarea
    id: content
    attributes:
      label: 내용
      description: 사용자에게 알릴 공지 내용을 작성해 주세요.
      placeholder: 알려드릴 내용을 입력하세요.
    validations:
      required: true
