[package]
name = "jungle-bell"
version = "0.5.6"
description = "Krafton Jungle attendance check reminder"
authors = ["sijun-yang"]
edition = "2021"

[lib]
name = "jungle_bell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "fs", "macros"] }
dirs = "6"
log = "0.4"
tauri-plugin-log = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify-rust = { version = "4.18", features = ["preview-macos-un"] }
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication"] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }

[dev-dependencies]
tempfile = "3"

# notify-rust 4.18의 현대식 macOS 백엔드가 요구하는 3.0.4가 현재 레지스트리
# 미러에 반영되기 전에도 동일 소스를 재현 가능하게 사용한다.
[patch.crates-io]
futures-timer = { git = "https://github.com/async-rs/futures-timer", rev = "e8d2e877147bcdbe5b64c0fbf5df1f2dce1c4253" }
