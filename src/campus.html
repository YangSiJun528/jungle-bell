<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="styles.css"/>
    <title>생활 정보</title>
</head>
<body class="campus-body" x-data="campus">
<main class="campus-shell">
    <header class="header campus-header">
        <img src="assets/logo.png" alt="Jungle Bell" class="logo"/>
        <div class="campus-heading"><h1>생활 정보</h1><p>크래프톤 정글</p></div>
        <button type="button" class="icon-btn" title="새로고침" aria-label="현재 탭 새로고침"
                :disabled="refreshing" :class="{'is-refreshing': refreshing}" :aria-busy="refreshing" @click="refresh()">
            <span aria-hidden="true">↻</span>
        </button>
    </header>

    <nav class="tabs campus-tabs" aria-label="생활 정보 종류">
        <button type="button" class="tab-btn" :class="{active: activeTab === 'laundry'}"
                :aria-selected="activeTab === 'laundry'" @click="selectTab('laundry')">세탁</button>
        <button type="button" class="tab-btn" :class="{active: activeTab === 'meals'}"
                :aria-selected="activeTab === 'meals'" @click="selectTab('meals')">급식</button>
    </nav>

    <section class="tab-content campus-panel" :class="{active: activeTab === 'laundry'}" aria-labelledby="laundry-title">
        <div class="source-state" :data-tone="source.laundry.tone" role="status">
            <span class="source-dot" aria-hidden="true"></span>
            <div class="source-copy"><strong x-text="source.laundry.title"></strong><span x-text="source.laundry.detail"></span></div>
        </div>

        <div x-show="laundry">
            <section class="laundry-overview" aria-labelledby="laundry-overview-title">
                <div class="laundry-overview-heading">
                    <h2 id="laundry-overview-title">현재 사용 현황</h2>
                </div>

                <div class="laundry-type-summary-grid">
                    <template x-for="kind in ['washer', 'dryer']" :key="kind">
                        <div class="laundry-type-summary" :data-kind="kind">
                            <div class="laundry-type-summary-main">
                                <strong x-text="kind === 'washer' ? '세탁기' : '건조기'"></strong>
                                <span><b x-text="typeSummary(kind).available"></b>/<span x-text="typeSummary(kind).total"></span>대 사용 가능</span>
                            </div>
                            <div class="availability-track" role="progressbar" :aria-label="`사용 가능한 ${kind === 'washer' ? '세탁기' : '건조기'} 비율`"
                                 aria-valuemin="0" aria-valuemax="100" :aria-valuenow="typeSummary(kind).percent">
                                <span class="availability-fill" :style="`width: ${typeSummary(kind).percent}%`"></span>
                            </div>
                            <div class="laundry-type-breakdown">
                                <span><i data-tone="active"></i><b x-text="typeSummary(kind).active"></b> 작동 중</span>
                                <span><i data-tone="issue"></i><b x-text="typeSummary(kind).issue"></b> 확인 필요</span>
                            </div>
                        </div>
                    </template>
                </div>
            </section>

            <div class="section-heading filter-heading">
                <div class="laundry-list-title"><h2 id="laundry-title">워시타워</h2><span x-text="`${filteredMachines().length}대`"></span></div>
            </div>
            <div class="laundry-filter-toolbar">
                <div class="segmented-control zone-control" role="group" aria-label="워시타워 이용 구역 필터">
                    <template x-for="access in [{value:'all', label:'전체'}, {value:'men', label:'남성 가능'}, {value:'women', label:'여성 가능'}]" :key="access.value">
                        <button type="button" class="segment" :class="{active: laundryAccess === access.value}"
                                :aria-pressed="laundryAccess === access.value" @click="laundryAccess = access.value" x-text="access.label"></button>
                    </template>
                </div>
                <div class="segmented-control status-control" role="group" aria-label="워시타워 상태 필터">
                    <template x-for="filter in [{value:'all', label:'전체'}, {value:'active', label:'작동 중'}, {value:'available', label:'사용 가능'}]" :key="filter.value">
                        <button type="button" class="segment" :class="{active: laundryFilter === filter.value}"
                                :aria-pressed="laundryFilter === filter.value" @click="laundryFilter = filter.value" x-text="filter.label"></button>
                    </template>
                </div>
            </div>

            <div class="laundry-list" aria-live="polite">
                <template x-if="filteredMachines().length === 0"><div class="inline-empty" x-text="laundryEmptyMessage()"></div></template>
                <template x-for="machine in filteredMachines()" :key="machine.id">
                    <article class="laundry-card">
                        <div class="laundry-card-header">
                            <div class="laundry-card-title"><h3 x-text="machineName(machine.id)"></h3><span class="zone-badge" x-text="machineZoneLabel(machine.id)"></span></div>
                            <span x-text="machineSummary(machine)"></span>
                        </div>
                        <div class="appliance-grid">
                            <template x-for="entry in [{kind:'washer', appliance:machine.washer}, {kind:'dryer', appliance:machine.dryer}]" :key="entry.kind">
                                <section class="appliance-row" :data-tone="projectionView(entry.appliance).tone">
                                    <div class="appliance-row-main">
                                        <div class="appliance-heading">
                                            <h4 x-text="entry.kind === 'washer' ? '세탁기' : '건조기'"></h4>
                                            <span class="status-badge" :data-tone="projectionView(entry.appliance).tone" x-text="projectionView(entry.appliance).label"></span>
                                        </div>
                                        <p class="appliance-unavailable" x-show="!entry.appliance">기기 정보 없음</p>
                                        <div class="appliance-time-row" x-show="entry.appliance">
                                            <strong class="remaining-time" x-text="remainingText(entry.appliance)"></strong>
                                            <span class="estimate-label" x-text="entry.appliance?.projection?.estimated ? '추정' : '관측'"></span>
                                        </div>
                                    </div>
                                    <div class="progress-track" role="progressbar" x-show="progress(entry.appliance) !== null"
                                         aria-valuemin="0" aria-valuemax="100" :aria-valuenow="Math.round(progress(entry.appliance) ?? 0)"
                                         :aria-label="`${entry.kind === 'washer' ? '세탁' : '건조'} 진행률`">
                                        <span class="progress-fill" :style="`width: ${progress(entry.appliance) ?? 0}%`"></span>
                                    </div>
                                    <div class="appliance-meta"
                                         x-show="entry.appliance?.errorCode || (entry.appliance?.estimatedFinishAt && applianceIsActive(entry.appliance))">
                                        <span class="error-code" x-show="entry.appliance?.errorCode"
                                              :title="`오류 코드 ${entry.appliance?.errorCode}`" x-text="`오류 코드 ${entry.appliance?.errorCode}`"></span>
                                        <span x-show="entry.appliance?.estimatedFinishAt && applianceIsActive(entry.appliance)"
                                              x-text="`예상 종료 ${formatClock(entry.appliance?.estimatedFinishAt)}`"></span>
                                    </div>
                                    <div class="inline-info" x-data="{expanded:false, hovered:false}"
                                         x-show="applianceInfo(entry.appliance, entry.kind)"
                                         @mouseenter="hovered = true" @mouseleave="hovered = false"
                                         @keydown.escape="expanded = false">
                                        <button type="button" class="info-icon-btn"
                                                :title="applianceInfo(entry.appliance, entry.kind)?.title ?? '기기 상태 안내'"
                                                :aria-label="applianceInfo(entry.appliance, entry.kind)?.title ?? '기기 상태 안내'"
                                                :aria-expanded="expanded || hovered" @click="expanded = !expanded"
                                                @focus="hovered = true" @blur="hovered = false"><span aria-hidden="true">i</span></button>
                                        <p class="inline-info-detail" role="note" x-show="expanded || hovered">
                                            <strong x-text="applianceInfo(entry.appliance, entry.kind)?.title"></strong>
                                            <span x-text="applianceInfo(entry.appliance, entry.kind)?.detail"></span>
                                        </p>
                                    </div>
                                </section>
                            </template>
                        </div>
                    </article>
                </template>
            </div>
        </div>

        <div class="content-state" aria-live="polite" x-show="!laundry">
            <span class="loading-spinner" aria-hidden="true" x-show="!errors.laundry"></span>
            <strong x-text="errors.laundry ? '현재 정보를 불러올 수 없습니다.' : '세탁기 현황을 불러오는 중입니다.'"></strong>
            <button type="button" class="secondary-btn" x-show="errors.laundry" @click="refresh()">다시 시도</button>
        </div>
    </section>

    <section class="tab-content campus-panel" :class="{active: activeTab === 'meals'}" aria-labelledby="today-meals-title">
        <div class="source-state" :data-tone="source.meals.tone" role="status">
            <span class="source-dot" aria-hidden="true"></span>
            <div class="source-copy"><strong x-text="source.meals.title"></strong><span x-text="source.meals.detail"></span></div>
        </div>

        <div x-show="meals">
            <div class="section-heading meal-date-heading"><div><h2 id="today-meals-title">오늘의 식단</h2><p x-text="formatToday()"></p></div></div>
            <div class="today-meals">
                <template x-for="period in ['lunch', 'dinner']" :key="period">
                    <article class="meal-card today-meal-card" :class="{'meal-card-empty': !todayMeal(period)}">
                        <div class="meal-card-header">
                            <h3 x-text="period === 'lunch' ? '중식' : '석식'"></h3>
                            <span class="status-badge" :data-tone="todayMeal(period) ? 'success' : 'neutral'" x-text="todayMeal(period) ? '게시됨' : '게시 전'"></span>
                        </div>
                        <p x-show="!todayMeal(period)" x-text="`오늘 ${period === 'lunch' ? '중식' : '석식'} 식단이 아직 게시되지 않았습니다.`"></p>
                        <div class="today-meal-content" x-show="todayMeal(period)">
                            <button type="button" class="today-meal-image meal-image-btn" x-show="imageUrl(todayMeal(period))"
                                    :aria-label="`${todayMeal(period)?.title ?? '식단'} 이미지 크게 보기`" @click="openImage(todayMeal(period), $refs.imageDialog)">
                                <img :src="imageUrl(todayMeal(period))" :alt="todayMeal(period)?.title ?? '식단 이미지'" loading="lazy"/>
                            </button>
                            <div class="today-meal-image meal-image-empty" x-show="!imageUrl(todayMeal(period))">이미지 없음</div>
                            <div class="meal-card-copy">
                                <p class="meal-menu-text" x-text="todayMeal(period)?.text || '메뉴 내용이 없습니다.'"></p>
                                <div class="meal-card-footer">
                                    <span x-show="todayMeal(period)?.publishedAt" x-text="`게시 ${relativeTime(todayMeal(period)?.publishedAt)}`"></span>
                                    <button type="button" class="link-btn meal-post-link" x-show="safeKakaoUrl(todayMeal(period)?.permalink)" @click="openPost(todayMeal(period))">원문 보기</button>
                                </div>
                            </div>
                        </div>
                    </article>
                </template>
            </div>

            <div class="section-heading"><h2>이번 주 식단표</h2></div>
            <div class="weekly-meals">
                <div class="inline-empty" x-show="meals?.data.pinnedMenus.length === 0">게시된 주간 식단표가 없습니다.</div>
                <template x-for="(post, index) in meals?.data.pinnedMenus ?? []" :key="postKey(post, index)">
                    <article class="meal-card weekly-meal-card">
                        <div class="meal-card-header"><h3 x-text="post.title ?? '주간 식단표'"></h3><button type="button" class="link-btn meal-post-link" x-show="safeKakaoUrl(post.permalink)" @click="openPost(post)">원문 보기</button></div>
                        <button type="button" class="weekly-meal-image meal-image-btn" x-show="imageUrl(post)" :aria-label="`${post.title ?? '식단'} 이미지 크게 보기`" @click="openImage(post, $refs.imageDialog)">
                            <img :src="imageUrl(post)" :alt="post.title ?? '식단 이미지'" loading="lazy"/>
                        </button>
                        <div class="weekly-meal-image meal-image-empty" x-show="!imageUrl(post)">이미지 없음</div>
                        <p class="weekly-meal-text" x-show="post.text" x-text="post.text"></p>
                    </article>
                </template>
            </div>

            <div class="section-heading"><h2>최근 식단</h2></div>
            <div class="recent-meals">
                <div class="inline-empty" x-show="recentMenus().length === 0">최근 식단이 없습니다.</div>
                <template x-for="(post, index) in recentMenus()" :key="postKey(post, index)">
                    <article class="recent-meal-row">
                        <button type="button" class="recent-meal-image meal-image-btn" x-show="imageUrl(post)" :aria-label="`${post.title ?? '식단'} 이미지 크게 보기`" @click="openImage(post, $refs.imageDialog)">
                            <img :src="imageUrl(post)" :alt="post.title ?? '식단 이미지'" loading="lazy"/>
                        </button>
                        <div class="recent-meal-image meal-image-empty" x-show="!imageUrl(post)">이미지 없음</div>
                        <div class="recent-meal-copy"><h3 x-text="post.title ?? '식단'"></h3><p x-text="post.text || '메뉴 내용이 없습니다.'"></p></div>
                        <button type="button" class="link-btn meal-post-link" x-show="safeKakaoUrl(post.permalink)" @click="openPost(post)">원문 보기</button>
                    </article>
                </template>
            </div>
        </div>

        <div class="content-state" aria-live="polite" x-show="!meals">
            <span class="loading-spinner" aria-hidden="true" x-show="!errors.meals"></span>
            <strong x-text="errors.meals ? '현재 정보를 불러올 수 없습니다.' : '식단을 불러오는 중입니다.'"></strong>
            <button type="button" class="secondary-btn" x-show="errors.meals" @click="refresh()">다시 시도</button>
        </div>
    </section>
</main>

<dialog class="image-dialog" aria-labelledby="image-dialog-caption" x-ref="imageDialog" @click.self="closeImage($refs.imageDialog)">
    <div class="image-dialog-bar"><strong id="image-dialog-caption" x-text="dialogCaption"></strong>
        <button type="button" class="icon-btn dialog-close" title="닫기" aria-label="이미지 닫기" @click="closeImage($refs.imageDialog)"><span aria-hidden="true">×</span></button>
    </div>
    <img :src="dialogImage" :alt="dialogCaption ? `${dialogCaption} 이미지` : ''"/>
</dialog>

<script type="module" src="/campus.ts"></script>
</body>
</html>
