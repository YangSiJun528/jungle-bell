<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="color-scheme" content="light"/>
    <link rel="stylesheet" href="ui.css"/>
    <link rel="license" href="assets/fonts/Pretendard-LICENSE.txt"/>
    <title>Jungle Bell 생활 정보</title>
</head>
<body class="h-screen bg-app-bg font-sans text-app-text" data-ui-page="campus" x-data="campus">
<main class="mx-auto flex min-h-full w-full flex-col">
    <header class="ui-page-header flex-none">
        <img src="assets/logo.png" alt="" class="size-12 flex-none rounded-lg object-cover"/>
        <h1 class="ui-page-title min-w-0 flex-1">생활 정보</h1>
        <aside class="flex min-h-12 max-w-1/2 items-center justify-end gap-2 pr-2 text-xs text-app-muted" :data-tone="sourceView(activeTab).tone" aria-live="polite">
            <i class="size-2 flex-none rounded-full bg-app-status-neutral data-[tone=success]:bg-app-success data-[tone=warning]:bg-app-warning data-[tone=danger]:bg-app-danger" aria-hidden="true"></i><strong class="min-w-0 truncate" x-text="sourceView(activeTab).label"></strong>
            <details class="group relative flex-none" x-data="infoDisclosure" :open="visible"
                     @mouseenter="enter()" @mouseleave="leave()" @focusin="focus()" @focusout="blur()"
                     @keydown.escape.stop="dismiss()" @click.outside="dismiss()"
                     @info-disclosure-open.window="handlePeer($event)" @info-disclosure-dismiss.window="dismiss()">
                <summary class="flex size-6 cursor-pointer list-none items-center justify-center rounded-full border border-app-border bg-app-surface text-xs font-bold text-app-muted transition-colors duration-200 hover:border-app-accent hover:text-app-accent group-open:border-app-accent group-open:text-app-accent" x-ref="trigger" :aria-label="`${activeTab === 'laundry' ? '세탁기' : '식단'} 정보 갱신 안내`" @click.prevent="toggle()">i</summary>
                <aside class="fixed z-40 max-h-[calc(100vh-32px)] w-[min(40vw,calc(100vw-32px))] overflow-y-auto rounded-lg bg-app-overlay shadow-lg p-2 text-xs leading-[1.5] text-app-text [word-break:keep-all]" x-show="visible" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-1" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" x-anchor.fixed.bottom-end.offset.16="$refs.trigger"><strong class="mb-1 block text-xs" x-text="sourceInfo(activeTab).title"></strong><p class="m-0 text-xs leading-[1.5] text-app-muted" x-text="sourceInfo(activeTab).detail"></p></aside>
            </details>
        </aside>
    </header>

    <nav class="ui-tabs flex-none" role="tablist" aria-label="생활 정보 종류">
        <button id="campus-tab-laundry" x-ref="laundryTab" type="button" class="ui-tab" role="tab" :aria-selected="activeTab === 'laundry'" :tabindex="activeTab === 'laundry' ? 0 : -1" aria-controls="laundry-panel" @click="selectTab('laundry')" @keydown.arrow-left.prevent="selectTab('meals'); $nextTick(() => $refs.mealsTab.focus())" @keydown.arrow-right.prevent="selectTab('meals'); $nextTick(() => $refs.mealsTab.focus())">세탁</button>
        <button id="campus-tab-meals" x-ref="mealsTab" type="button" class="ui-tab" role="tab" :aria-selected="activeTab === 'meals'" :tabindex="activeTab === 'meals' ? 0 : -1" aria-controls="meals-panel" @click="selectTab('meals')" @keydown.arrow-left.prevent="selectTab('laundry'); $nextTick(() => $refs.laundryTab.focus())" @keydown.arrow-right.prevent="selectTab('laundry'); $nextTick(() => $refs.laundryTab.focus())">급식</button>
    </nav>

    <section id="laundry-panel" class="flex-1" role="tabpanel" aria-labelledby="campus-tab-laundry" x-show="activeTab === 'laundry'" x-cloak>
        <div x-show="laundry">
            <section aria-labelledby="laundry-title">
                <div class="ui-card mb-4" :data-access="laundryAccess" :data-filter="laundryFilter">
                    <header class="mb-4 flex min-h-8 items-center justify-between gap-4">
                        <h2 id="laundry-title" class="ui-section-title">워시타워</h2>
                        <ul class="m-0 flex list-none items-center gap-2 p-0 text-ui-caption text-app-muted" aria-label="워시타워 구역 색상"><li class="inline-flex items-center gap-1 whitespace-nowrap"><i class="size-2 rounded-full bg-app-men"></i>남성</li><li class="inline-flex items-center gap-1 whitespace-nowrap"><i class="size-2 rounded-full bg-app-common"></i>공용</li><li class="inline-flex items-center gap-1 whitespace-nowrap"><i class="size-2 rounded-full bg-app-women"></i>여성</li></ul>
                    </header>
                    <table class="w-full table-fixed border-separate border-spacing-1">
                        <caption class="sr-only">워시타워 번호별 건조기와 세탁기 사용 가능 현황</caption>
                        <thead><tr><th class="h-6 w-24 p-0 text-left text-ui-caption font-bold text-app-faint" scope="col">기기</th><template x-for="segment in availabilitySegments('washer')" :key="`heading-${segment.number}`"><th class="h-6 p-0 text-center font-mono text-ui-caption font-bold text-app-faint tabular-nums" :class="{'text-app-men': segment.zone === 'men', 'text-app-common': segment.zone === 'common', 'text-app-women': segment.zone === 'women', 'opacity-25 blur-[2px]': (laundryAccess === 'men' && segment.zone === 'women') || (laundryAccess === 'women' && segment.zone === 'men')}" scope="col" :data-zone="segment.zone" x-text="segment.number"></th></template></tr></thead>
                        <tbody><template x-for="row in [{kind:'dryer', label:'건조기'}, {kind:'washer', label:'세탁기'}]" :key="row.kind"><tr :data-kind="row.kind"><th class="h-6 p-0 text-left text-xs font-bold" :class="{'opacity-25 blur-[2px]': (laundryFilter === 'washerAvailable' && row.kind === 'dryer') || (laundryFilter === 'dryerAvailable' && row.kind === 'washer')}" scope="row"><span x-text="row.label"></span><small class="ml-2 font-mono text-ui-caption font-normal text-app-muted tabular-nums"><b class="text-app-success" x-text="typeSummary(row.kind).available"></b>/<span x-text="typeSummary(row.kind).total"></span></small></th><template x-for="segment in availabilitySegments(row.kind)" :key="segment.id"><td class="h-6 p-0 transition" :class="{'opacity-25 blur-[2px]': (laundryAccess === 'men' && segment.zone === 'women') || (laundryAccess === 'women' && segment.zone === 'men') || (laundryFilter === 'washerAvailable' && row.kind === 'dryer') || (laundryFilter === 'dryerAvailable' && row.kind === 'washer')}" :data-zone="segment.zone" :data-state="segment.state" :title="segment.label"><span class="flex h-6 w-full items-center justify-center rounded font-mono text-ui-caption leading-none font-bold text-app-on-accent tabular-nums" :class="{'bg-app-status-neutral': segment.state !== 'available', 'bg-app-men': segment.state === 'available' && segment.zone === 'men', 'bg-app-common': segment.state === 'available' && segment.zone === 'common', 'bg-app-women': segment.state === 'available' && segment.zone === 'women', 'bg-app-success': segment.state === 'available' && segment.zone === 'other'}" aria-hidden="true" x-text="segment.overviewText"></span><span class="sr-only" x-text="segment.label"></span></td></template></tr></template></tbody>
                    </table>
                    <section class="mt-4 border-t border-app-divider pt-4" data-ui="laundry-access-situations" aria-labelledby="laundry-situation-title">
                        <header class="mb-2">
                            <h3 id="laundry-situation-title" class="m-0 text-sm font-bold">지금 세탁해도 될까요?</h3>
                        </header>
                        <div class="grid grid-cols-2 gap-2">
                            <template x-for="situation in laundryAccessSituations()" :key="situation.access">
                                <article
                                    class="ui-card min-w-0 p-3"
                                    :class="{
                                        'bg-app-surface-subtle': situation.state === 'checking',
                                        'bg-app-warning-soft': situation.state === 'limited' || situation.state === 'dryerBottleneck',
                                        'bg-app-success-soft': situation.state === 'comfortable',
                                        'bg-app-accent-soft': situation.state === 'available',
                                    }"
                                    :data-access="situation.access"
                                    :data-state="situation.state"
                                >
                                    <header class="flex min-w-0 items-center justify-between gap-2">
                                        <strong class="min-w-0 truncate text-xs" x-text="laundrySituationAccessLabel(situation)"></strong>
                                        <span
                                            class="ui-badge"
                                            :class="{
                                                'bg-app-warning-soft text-app-warning': situation.state === 'limited' || situation.state === 'dryerBottleneck',
                                                'bg-app-success-soft text-app-success': situation.state === 'comfortable',
                                                'bg-app-accent-soft text-app-accent': situation.state === 'available',
                                            }"
                                            x-text="laundrySituationStateLabel(situation)"
                                        ></span>
                                    </header>
                                    <p class="mt-2 text-xs font-bold leading-relaxed" x-text="laundrySituationRecommendationLabel(situation)"></p>
                                </article>
                            </template>
                        </div>
                    </section>
                </div>

                <div class="ui-card mb-4 grid grid-cols-2">
                    <fieldset class="m-0 min-w-0 border-0 pr-4"><legend class="w-full p-0 text-xs font-bold text-app-muted">구역</legend><div class="mt-1 grid grid-cols-3 gap-2"><template x-for="access in [{value:'all', label:'전체'}, {value:'men', label:'남성 가능'}, {value:'women', label:'여성 가능'}]" :key="access.value"><label class="relative min-w-0"><input class="peer sr-only" type="radio" name="laundry-access" :value="access.value" x-model="laundryAccess"/><span class="flex min-h-8 cursor-pointer items-center justify-center truncate rounded-lg border border-app-border bg-app-control p-1 text-ui-caption font-bold text-app-muted peer-checked:border-app-accent peer-checked:bg-app-accent-soft peer-checked:text-app-accent ui-focus-proxy" :class="{'peer-checked:border-app-men peer-checked:bg-app-men-soft peer-checked:text-app-men': access.value === 'men', 'peer-checked:border-app-women peer-checked:bg-app-women-soft peer-checked:text-app-women': access.value === 'women'}" x-text="access.label"></span></label></template></div></fieldset>
                    <fieldset class="m-0 min-w-0 border-0 border-l border-app-divider pl-4"><legend class="w-full p-0 text-xs font-bold text-app-muted">상태</legend><div class="mt-1 grid grid-cols-3 gap-2"><template x-for="filter in [{value:'all', label:'전체'}, {value:'washerAvailable', label:'세탁'}, {value:'dryerAvailable', label:'건조'}]" :key="filter.value"><label class="relative min-w-0"><input class="peer sr-only" type="radio" name="laundry-status" :value="filter.value" x-model="laundryFilter"/><span class="flex min-h-8 cursor-pointer items-center justify-center truncate rounded-lg border border-app-border bg-app-control p-1 text-ui-caption font-bold text-app-muted peer-checked:border-app-accent peer-checked:bg-app-accent-soft peer-checked:text-app-accent ui-focus-proxy" x-text="filter.label"></span></label></template></div></fieldset>
                </div>

                <p class="ui-empty-state" x-show="filteredMachines().length === 0" x-text="laundryEmptyMessage()"></p>
                <div class="grid grid-cols-3 items-stretch gap-4">
                    <template x-for="machine in filteredMachines()" :key="machine.id">
                        <article class="ui-card grid min-w-0 grid-rows-[32px_112px_112px] overflow-visible p-0" :data-zone="machineZone(machine.id)">
                            <header class="flex min-h-8 items-center justify-between gap-2 border-b border-app-divider px-2 py-1"><h3 class="m-0 truncate text-xs font-bold" x-text="machineName(machine.id)"></h3><span class="ui-badge max-w-24 truncate" :class="{'bg-app-men-soft text-app-men': machineZone(machine.id) === 'men', 'bg-app-common-soft text-app-common': machineZone(machine.id) === 'common', 'bg-app-women-soft text-app-women': machineZone(machine.id) === 'women'}" x-text="machineZoneLabel(machine.id)"></span></header>
                            <template x-for="entry in [{kind:'dryer', appliance:machine.dryer}, {kind:'washer', appliance:machine.washer}]" :key="entry.kind">
                                <section class="h-28 min-w-0 p-2 first-of-type:border-b first-of-type:border-app-divider" :data-tone="projectionView(entry.appliance).tone">
                                    <header class="flex min-h-6 w-full min-w-0 items-center justify-between gap-2"><h4 class="m-0 text-xs font-bold text-app-muted" x-text="entry.kind === 'washer' ? '세탁기' : '건조기'"></h4><div class="flex min-w-0 items-center justify-end gap-1"><span class="ui-badge max-w-24 truncate" :class="{'bg-app-success-soft text-app-success': projectionView(entry.appliance).tone === 'success', 'bg-app-accent-soft text-app-accent': projectionView(entry.appliance).tone === 'normal', 'bg-app-warning-soft text-app-warning': projectionView(entry.appliance).tone === 'warning', 'bg-app-danger-soft text-app-danger': projectionView(entry.appliance).tone === 'danger'}" :data-tone="projectionView(entry.appliance).tone" x-text="projectionView(entry.appliance).label"></span>
                                        <details class="group relative flex-none" x-show="applianceInfo(entry.appliance, entry.kind)" x-data="infoDisclosure" :open="visible" @mouseenter="enter()" @mouseleave="leave()" @focusin="focus()" @focusout="blur()" @keydown.escape.stop="dismiss()" @click.outside="dismiss()" @info-disclosure-open.window="handlePeer($event)" @info-disclosure-dismiss.window="dismiss()"><summary class="flex size-6 cursor-pointer list-none items-center justify-center rounded-full border border-app-border bg-app-surface text-xs font-bold text-app-muted transition-colors duration-200 hover:border-app-accent hover:text-app-accent group-open:border-app-accent group-open:text-app-accent" x-ref="trigger" :aria-label="applianceInfo(entry.appliance, entry.kind)?.title ?? '기기 상태 안내'" @click.prevent="toggle()">i</summary><aside class="ui-popover fixed z-40 max-h-[calc(100vh-32px)] w-[min(40vw,calc(100vw-32px))] overflow-y-auto text-xs leading-[1.5] text-app-text [word-break:keep-all]" x-show="visible" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-1" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" x-anchor.fixed.bottom-end.offset.16="$refs.trigger"><strong class="mb-1 block text-xs" x-text="applianceInfo(entry.appliance, entry.kind)?.title"></strong><p class="m-0 text-xs leading-[1.5] text-app-muted" x-text="applianceInfo(entry.appliance, entry.kind)?.detail"></p><code class="mt-2 block [overflow-wrap:anywhere] font-mono text-ui-caption text-app-danger" x-show="applianceInfo(entry.appliance, entry.kind)?.code" x-text="applianceInfo(entry.appliance, entry.kind)?.code"></code></aside></details>
                                    </div></header>
                                    <p class="mt-1 grid h-8 w-full min-w-0 grid-cols-[96px_64px] grid-rows-[24px_4px] items-center justify-between gap-y-1"><strong class="w-24 font-mono text-ui-body whitespace-nowrap tabular-nums" x-text="entry.appliance ? remainingText(entry.appliance) : '--'"></strong><small class="w-16 text-right font-mono text-ui-caption whitespace-nowrap text-app-muted tabular-nums" x-show="!entry.appliance">기기 정보 없음</small><small class="grid w-16 text-right font-mono text-ui-caption leading-3 whitespace-nowrap text-app-muted tabular-nums" x-show="applianceIsActive(entry.appliance) && (startAt(entry.appliance) || entry.appliance?.estimatedFinishAt)"><time x-show="startAt(entry.appliance)" :datetime="startAt(entry.appliance)" x-text="`${formatClock(startAt(entry.appliance))} 시작`"></time><time x-show="entry.appliance?.estimatedFinishAt" :datetime="entry.appliance?.estimatedFinishAt" x-text="`${formatClock(entry.appliance?.estimatedFinishAt)} 종료`"></time></small><progress class="ui-progress col-span-2 row-start-2" x-show="progress(entry.appliance) !== null" max="100" :value="progress(entry.appliance) ?? 0" :aria-label="applianceHasError(entry.appliance) ? `${entry.kind === 'washer' ? '세탁기' : '건조기'} 오류로 사용 불가` : `${entry.kind === 'washer' ? '세탁' : '건조'} 진행률`" :aria-valuetext="applianceHasError(entry.appliance) ? '오류로 사용 불가' : `${Math.round(progress(entry.appliance) ?? 0)}%`" x-text="`${Math.round(progress(entry.appliance) ?? 0)}%`"></progress></p>
                                    <footer class="mt-2 flex min-h-7 items-center justify-between gap-2" x-show="canWatchLaundry(entry.appliance) || isWatchedLaundry(machine.id, entry.kind, entry.appliance?.sessionId)" x-cloak>
                                        <small
                                            class="min-w-0 text-ui-caption text-app-muted"
                                            x-show="isWatchedLaundry(machine.id, entry.kind, entry.appliance?.sessionId)"
                                            :title="`종료 ${laundryWatch?.notifyBeforeMins}분 전에 알려드려요`"
                                        >알림을 받을 예정이에요</small>
                                        <details
                                            class="group relative ml-auto flex-none"
                                            data-ui="laundry-inline-watch"
                                            x-data="{watchMenuOpen: false}"
                                            :open="watchMenuOpen"
                                            @keydown.escape.stop="watchMenuOpen = false; $nextTick(() => $refs.watchTrigger.focus())"
                                            @click.outside="watchMenuOpen = false"
                                        >
                                            <summary
                                                class="ui-button ui-button--compact min-h-7 list-none border-0 bg-app-control px-2 py-1 text-ui-caption text-app-muted hover:bg-app-surface-subtle group-open:bg-app-accent-soft group-open:text-app-accent"
                                                :class="{'bg-app-accent-soft text-app-accent': isWatchedLaundry(machine.id, entry.kind, entry.appliance?.sessionId)}"
                                                x-ref="watchTrigger"
                                                :aria-controls="`laundry-watch-${machine.id}-${entry.kind}`"
                                                :aria-expanded="watchMenuOpen"
                                                :aria-label="`${machineName(machine.id)} 워시타워 ${entry.kind === 'washer' ? '세탁기' : '건조기'} ${isWatchedLaundry(machine.id, entry.kind, entry.appliance?.sessionId) ? '알림 설정' : '알림 받기'}`"
                                                x-text="isWatchedLaundry(machine.id, entry.kind, entry.appliance?.sessionId) ? '알림 설정' : '알림 받기'"
                                                @click.prevent="watchMenuOpen = !watchMenuOpen"
                                            ></summary>
                                            <aside
                                                class="ui-popover fixed z-40 w-64 text-app-text"
                                                :id="`laundry-watch-${machine.id}-${entry.kind}`"
                                                aria-label="세탁 알림 설정"
                                                x-show="watchMenuOpen"
                                                x-cloak
                                                x-anchor.fixed.bottom-end.offset.8="$refs.watchTrigger"
                                            >
                                                <strong class="block text-ui-label" x-text="`${machineName(machine.id)} ${entry.kind === 'washer' ? '세탁기' : '건조기'}`"></strong>
                                                <p class="mt-1 text-ui-caption leading-relaxed text-app-muted">이 작업의 종료 임박·완료·일시 정지·오류를 알려드려요.</p>
                                                <p class="mt-1 text-ui-caption leading-relaxed text-app-warning" x-show="laundryWatch && !isWatchedLaundry(machine.id, entry.kind, entry.appliance?.sessionId)">다른 작업 추적은 종료됩니다.</p>
                                                <label class="mt-3 flex items-center justify-between gap-3 text-ui-caption font-bold text-app-muted">
                                                    <span>종료 전 알림</span>
                                                    <select
                                                        class="ui-control h-8 min-h-8 px-2 py-1 font-mono text-ui-caption"
                                                        :value="isWatchedLaundry(machine.id, entry.kind, entry.appliance?.sessionId) ? laundryWatch?.notifyBeforeMins : laundryAlertNotice"
                                                        :disabled="subscriptionBusy"
                                                        @change="isWatchedLaundry(machine.id, entry.kind, entry.appliance?.sessionId) ? updateLaundryNotice(Number($event.currentTarget.value), $event.currentTarget) : laundryAlertNotice = Number($event.currentTarget.value)"
                                                    >
                                                        <template x-for="minutes in laundryNoticeMinutes" :key="minutes"><option :value="minutes" x-text="`${minutes}분`"></option></template>
                                                    </select>
                                                </label>
                                                <button
                                                    type="button"
                                                    class="ui-button ui-button--primary ui-button--compact mt-3 w-full"
                                                    x-show="!isWatchedLaundry(machine.id, entry.kind, entry.appliance?.sessionId)"
                                                    :disabled="subscriptionBusy"
                                                    @click="watchLaundry(machine.id, entry.kind, entry.appliance?.sessionId).then((saved) => { if (!saved) return; watchMenuOpen = false; $nextTick(() => $refs.watchTrigger.focus()); })"
                                                >이 작업이 끝나면 알림 받기</button>
                                                <button
                                                    type="button"
                                                    class="ui-button ui-button--ghost ui-button--compact mt-3 w-full text-app-danger hover:bg-app-danger-soft"
                                                    x-show="isWatchedLaundry(machine.id, entry.kind, entry.appliance?.sessionId)"
                                                    :disabled="subscriptionBusy"
                                                    @click="clearLaundryWatch().then((saved) => { if (!saved) return; watchMenuOpen = false; $nextTick(() => $refs.watchTrigger.focus()); })"
                                                >추적 종료</button>
                                            </aside>
                                        </details>
                                    </footer>
                                </section>
                            </template>
                        </article>
                    </template>
                </div>
            </section>
        </div>
        <section class="space-y-4" aria-live="polite" aria-busy="true" aria-label="세탁기 현황 불러오는 중" x-show="!laundry && !errors.laundry">
            <span class="sr-only">세탁기 현황을 불러오는 중입니다.</span>
            <div class="space-y-4 animate-pulse motion-reduce:animate-none" data-skeleton="laundry" aria-hidden="true">
                <section class="ui-card"><header class="mb-4 flex min-h-8 items-center justify-between"><i class="h-5 w-20 rounded bg-app-control"></i><i class="h-3 w-32 rounded bg-app-control"></i></header><div class="grid grid-cols-[96px_repeat(9,minmax(0,1fr))] gap-1"><i class="h-6 rounded bg-app-control"></i><template x-for="index in 9" :key="`dryer-skeleton-${index}`"><i class="h-6 rounded bg-app-control"></i></template><i class="h-6 rounded bg-app-control"></i><template x-for="index in 9" :key="`washer-skeleton-${index}`"><i class="h-6 rounded bg-app-control"></i></template></div></section>
                <section class="ui-card grid grid-cols-2 gap-4"><template x-for="group in 2" :key="`filter-skeleton-${group}`"><div class="space-y-2"><i class="block h-3 w-12 rounded bg-app-control"></i><div class="grid grid-cols-3 gap-2"><template x-for="index in 3" :key="`filter-skeleton-${group}-${index}`"><i class="h-8 rounded-lg bg-app-control"></i></template></div></div></template></section>
                <div class="grid grid-cols-3 gap-4"><template x-for="index in 3" :key="`machine-skeleton-${index}`"><article class="ui-card overflow-hidden p-0"><header class="flex h-8 items-center justify-between border-b border-app-divider px-2"><i class="h-3 w-8 rounded bg-app-control"></i><i class="h-4 w-10 rounded-full bg-app-control"></i></header><template x-for="kind in 2" :key="`machine-skeleton-${index}-${kind}`"><section class="h-28 space-y-3 border-b border-app-divider p-2 last:border-0"><div class="flex justify-between"><i class="h-3 w-10 rounded bg-app-control"></i><i class="h-5 w-14 rounded-full bg-app-control"></i></div><i class="block h-5 w-20 rounded bg-app-control"></i><i class="block h-1 w-full rounded-full bg-app-control"></i></section></template></article></template></div>
            </div>
        </section>
        <section class="ui-empty-state mt-6 flex-col" aria-live="polite" x-show="!laundry && errors.laundry"><strong>현재 정보를 불러올 수 없습니다.</strong><button type="button" class="ui-button ui-button--secondary ui-button--compact" :disabled="retrying" :aria-busy="retrying" @click="retry()" x-text="retrying ? '다시 시도 중' : '다시 시도'"></button></section>
    </section>

    <section id="meals-panel" class="flex-1" role="tabpanel" aria-labelledby="campus-tab-meals" x-show="activeTab === 'meals'" x-cloak>
        <div x-show="meals">
            <nav class="mb-4 flex justify-center" aria-label="급식 보기"><ul class="m-0 inline-grid h-10 list-none grid-cols-2 items-center rounded-lg bg-app-control p-1 text-app-muted"><li><button type="button" class="ui-button ui-button--ghost ui-button--compact relative z-20 min-w-12 border-0 text-app-muted whitespace-nowrap hover:text-app-text aria-[current=page]:bg-app-surface aria-[current=page]:text-app-accent aria-[current=page]:shadow-sm" :aria-current="mealView === 'current' ? 'page' : undefined" @click="selectMealView('current')">식단</button></li><li><button type="button" class="ui-button ui-button--ghost ui-button--compact relative z-20 min-w-12 border-0 text-app-muted whitespace-nowrap hover:text-app-text aria-[current=page]:bg-app-surface aria-[current=page]:text-app-accent aria-[current=page]:shadow-sm" :aria-current="mealView === 'history' ? 'page' : undefined" @click="selectMealView('history')">내역</button></li></ul></nav>
            <div x-show="mealView === 'current'">
                <section aria-labelledby="today-meals-title"><header class="mt-6 mb-2 flex min-h-8 items-end justify-between gap-4"><div><h2 id="today-meals-title" class="ui-section-title">오늘의 식단</h2><p class="mt-1 text-ui-caption text-app-faint"><time :datetime="mealSelectedDate" x-text="formatToday()"></time></p></div></header><p class="ui-empty-state" x-show="!mealsServedToday()">일요일에는 오늘의 식단이 없습니다.</p><div class="grid grid-cols-2 gap-4" x-show="mealsServedToday()"><template x-for="period in ['lunch', 'dinner']" :key="period"><article class="ui-card flex min-h-0 min-w-0 flex-col overflow-hidden p-0" :class="{'bg-app-surface-subtle': !todayMeal(period)}"><header class="flex min-h-12 items-center border-b border-app-divider px-4 py-2"><h3 class="m-0 text-ui-label font-bold" x-text="period === 'lunch' ? '중식' : '석식'"></h3></header><p class="flex min-h-24 flex-1 items-center justify-center p-6 text-center text-ui-caption text-app-muted" x-show="!todayMeal(period)" x-text="`오늘 ${period === 'lunch' ? '중식' : '석식'} 식단이 아직 게시되지 않았습니다.`"></p><div class="grid min-h-24 flex-1 grid-cols-[42%_minmax(0,1fr)]" x-show="todayMeal(period)"><button type="button" class="min-h-24 cursor-zoom-in overflow-hidden border-0 bg-app-control p-0 active:scale-[.97] [&_img]:h-full [&_img]:w-full [&_img]:object-cover" x-show="imageUrl(todayMeal(period))" :aria-label="`${todayMeal(period)?.title ?? '식단'} 이미지 크게 보기`" @click="openImage(todayMeal(period))"><img :src="imageUrl(todayMeal(period))" :alt="todayMeal(period)?.title ?? '식단 이미지'" loading="lazy"/></button><span class="flex min-h-24 items-center justify-center bg-app-control text-ui-caption text-app-muted" x-show="!imageUrl(todayMeal(period))">이미지 없음</span><section class="flex min-w-0 flex-col justify-between gap-2 p-4"><p class="line-clamp-7 break-normal whitespace-pre-line text-ui-caption leading-[1.55]" x-text="todayMeal(period)?.text || '메뉴 내용이 없습니다.'"></p><footer class="flex items-center justify-between gap-2 text-ui-caption text-app-faint"><time x-show="todayMeal(period)?.publishedAt" :datetime="todayMeal(period)?.publishedAt" x-text="`게시 ${relativeTime(todayMeal(period)?.publishedAt)}`"></time><button type="button" class="ui-button ui-button--ghost ui-button--compact" x-show="safeKakaoUrl(todayMeal(period)?.permalink)" @click="openPost(todayMeal(period))">원문 보기</button></footer></section></div></article></template></div></section>
                <section aria-labelledby="weekly-meals-title"><header class="mt-6 mb-2 flex min-h-8 items-end"><div><h2 id="weekly-meals-title" class="ui-section-title">이번 주 식단표</h2><p class="mt-1 text-ui-caption text-app-faint" x-text="mealWeekLabel()"></p></div></header><p class="ui-empty-state" x-show="!currentWeeklyMenu()">이번 주 식단표가 아직 게시되지 않았습니다.</p><div class="grid grid-cols-1 gap-6"><template x-for="post in currentWeeklyMenu() ? [currentWeeklyMenu()] : []" :key="postKey(post, 0)"><article class="ui-card min-w-0 overflow-hidden p-0"><button type="button" class="block min-h-24 w-full cursor-zoom-in border-0 bg-app-surface-subtle p-0 active:scale-[.97] [&_img]:block [&_img]:h-auto [&_img]:w-full [&_img]:object-cover" x-show="imageUrl(post)" :aria-label="`${post.title ?? '식단'} 이미지 크게 보기`" @click="openImage(post)"><img :src="imageUrl(post)" :alt="post.title ?? '식단 이미지'" :width="post.images?.[0]?.width" :height="post.images?.[0]?.height" loading="lazy"/></button><span class="flex min-h-24 items-center justify-center bg-app-control text-ui-caption text-app-muted" x-show="!imageUrl(post)">이미지 없음</span></article></template></div></section>
            </div>

            <div x-show="mealView === 'history'">
                <section class="ui-card overflow-hidden p-0" aria-labelledby="meal-calendar-title"><header class="grid min-h-16 grid-cols-[48px_minmax(0,1fr)_48px] items-center gap-2 border-b border-app-divider p-2"><button type="button" class="ui-button ui-button--secondary ui-button--icon size-12 p-0" title="이전 달" aria-label="이전 달" @click="moveMealMonth(-1)"><svg class="size-6" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2 id="meal-calendar-title" class="ui-section-title text-center" x-text="mealCalendarLabel()"></h2><button type="button" class="ui-button ui-button--secondary ui-button--icon size-12 p-0" title="다음 달" aria-label="다음 달" :disabled="!canMoveMealMonthNext()" @click="moveMealMonth(1)"><svg class="size-6" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></header>
                    <table class="w-full table-fixed border-collapse" aria-labelledby="meal-calendar-title"><caption class="sr-only" x-text="`${mealCalendarLabel()} 급식 달력`"></caption><thead><tr><template x-for="(weekday, index) in ['일', '월', '화', '수', '목', '금', '토']" :key="weekday"><th class="h-8 bg-app-surface-subtle p-0 text-center text-ui-caption font-bold text-app-muted" :class="{'text-app-danger': index === 0}" scope="col" :data-weekday="index" x-text="weekday"></th></template></tr></thead><tbody><template x-for="week in mealCalendarWeeks()" :key="week[0]?.key"><tr><template x-for="day in week" :key="day.key"><td class="h-16 border-t border-r border-app-divider p-0 align-top last:border-r-0"><button type="button" class="relative block h-full min-h-16 w-full border-0 bg-app-surface p-2 text-left text-ui-caption text-app-text hover:bg-app-surface-subtle active:scale-[.97] data-[outside=true]:bg-app-surface-subtle data-[outside=true]:text-app-faint data-[weekday='0']:text-app-danger aria-pressed:outline-2 aria-pressed:-outline-offset-2 aria-pressed:outline-app-accent" :data-outside="!day.inCurrentMonth" :data-weekday="day.weekday" :aria-current="day.isToday ? 'date' : undefined" :aria-label="`${day.key} 식단 ${day.posts.length}개`" :aria-pressed="mealSelectedDate === day.key" @click="selectMealDate(day)"><time class="block font-mono text-ui-caption tabular-nums aria-current:font-bold aria-current:text-app-accent" :datetime="day.key" x-text="day.day"></time><ul class="absolute inset-x-1 bottom-1 m-0 flex list-none justify-center gap-1 p-0" x-show="day.posts.length > 0" :aria-label="`${day.posts.length}개 식단`"><template x-for="post in day.posts" :key="postIdentity(post, 0)"><li><abbr class="flex size-4 items-center justify-center rounded-full bg-app-success-soft text-ui-caption leading-none font-bold text-app-success no-underline data-[period=dinner]:bg-app-warning-soft data-[period=dinner]:text-app-warning" :data-period="mealPeriodKind(post)" :title="mealPeriodLabel(post)" x-text="mealPeriodLabel(post).slice(0, 1)"></abbr></li></template></ul></button></td></template></tr></template></tbody></table>
                </section>
                <section class="mt-8" aria-labelledby="selected-meal-date-title"><header class="mb-2 flex min-h-8 items-end justify-between gap-4"><div><h2 id="selected-meal-date-title" class="ui-section-title" x-text="selectedMealDateLabel()"></h2><p class="mt-1 text-ui-caption text-app-faint" x-show="mealHistoryLoading">불러오는 중</p></div></header><p class="ui-empty-state" x-show="!mealHistoryLoading && selectedMealPosts().length === 0" x-text="selectedMealDateIsSunday() ? '일요일에는 식단이 없습니다.' : '이 날짜에 저장된 식단이 없습니다.'"></p><div class="grid gap-6"><template x-for="(post, index) in selectedMealPosts()" :key="postKey(post, index)"><article class="ui-card grid min-h-24 min-w-0 grid-cols-[96px_minmax(0,1fr)_auto] items-center gap-4"><button type="button" class="h-16 w-24 cursor-zoom-in overflow-hidden rounded-lg border-0 bg-app-control p-0 [&_img]:h-full [&_img]:w-full [&_img]:object-cover" x-show="imageUrl(post)" :aria-label="`${post.title ?? '식단'} 이미지 크게 보기`" @click="openImage(post)"><img :src="imageUrl(post)" :alt="post.title ?? '식단 이미지'" loading="lazy"/></button><span class="flex h-16 w-24 items-center justify-center rounded-lg bg-app-control text-ui-caption text-app-muted" x-show="!imageUrl(post)">이미지 없음</span><section class="min-w-0"><h3 class="m-0 truncate text-ui-label font-bold" x-text="post.title ?? '식단'"></h3><p class="mt-1 line-clamp-2 break-normal whitespace-pre-line text-ui-caption leading-[1.55]" x-text="post.text || '메뉴 내용이 없습니다.'"></p></section><button type="button" class="ui-button ui-button--ghost ui-button--compact" x-show="safeKakaoUrl(post.permalink)" @click="openPost(post)">원문 보기</button></article></template></div><p class="mt-4 rounded-lg border border-app-danger bg-app-danger-soft p-4 text-ui-caption text-app-danger" x-show="mealHistoryError">급식 내역을 불러오지 못했습니다.</p></section>
                <section class="mt-8" aria-labelledby="selected-meal-week-title"><header class="mb-2 flex min-h-8 items-end"><div><h2 id="selected-meal-week-title" class="ui-section-title">주간 식단표</h2><p class="mt-1 text-ui-caption text-app-faint" x-text="selectedMealWeekLabel()"></p></div></header><p class="ui-empty-state" x-show="!selectedWeeklyMenu()">이 주차에 저장된 식단표가 없습니다.</p><div class="grid grid-cols-1 gap-6"><template x-for="post in selectedWeeklyMenu() ? [selectedWeeklyMenu()] : []" :key="postKey(post, 0)"><article class="ui-card min-w-0 overflow-hidden p-0"><button type="button" class="block min-h-24 w-full cursor-zoom-in border-0 bg-app-surface-subtle p-0 [&_img]:block [&_img]:h-auto [&_img]:w-full [&_img]:object-cover" x-show="imageUrl(post)" :aria-label="`${post.title ?? '식단'} 이미지 크게 보기`" @click="openImage(post)"><img :src="imageUrl(post)" :alt="post.title ?? '식단 이미지'" :width="post.images?.[0]?.width" :height="post.images?.[0]?.height" loading="lazy"/></button><span class="flex min-h-24 items-center justify-center bg-app-control text-ui-caption text-app-muted" x-show="!imageUrl(post)">이미지 없음</span></article></template></div></section>
            </div>
        </div>
        <section class="space-y-6" aria-live="polite" aria-busy="true" aria-label="식단 불러오는 중" x-show="!meals && !errors.meals">
            <span class="sr-only">식단을 불러오는 중입니다.</span>
            <div class="space-y-6 animate-pulse motion-reduce:animate-none" data-skeleton="meals" aria-hidden="true">
                <i class="mx-auto block h-10 w-28 rounded-lg bg-app-control"></i>
                <section class="space-y-2"><div class="space-y-2"><i class="block h-5 w-24 rounded bg-app-control"></i><i class="block h-3 w-20 rounded bg-app-control"></i></div><div class="grid grid-cols-2 gap-4"><template x-for="index in 2" :key="`meal-skeleton-${index}`"><article class="ui-card overflow-hidden p-0"><header class="flex h-12 items-center justify-between border-b border-app-divider px-4"><i class="h-4 w-10 rounded bg-app-control"></i><i class="h-5 w-12 rounded-full bg-app-control"></i></header><div class="grid min-h-24 grid-cols-[42%_minmax(0,1fr)]"><i class="bg-app-control"></i><section class="space-y-2 p-4"><i class="block h-3 w-full rounded bg-app-control"></i><i class="block h-3 w-4/5 rounded bg-app-control"></i><i class="block h-3 w-3/5 rounded bg-app-control"></i></section></div></article></template></div></section>
                <section class="space-y-2"><i class="block h-5 w-28 rounded bg-app-control"></i><article class="ui-card min-h-40"><i class="block h-32 w-full rounded-lg bg-app-control"></i></article></section>
            </div>
        </section>
        <section class="ui-empty-state mt-6 flex-col" aria-live="polite" x-show="!meals && errors.meals"><strong>현재 정보를 불러올 수 없습니다.</strong><button type="button" class="ui-button ui-button--secondary ui-button--compact" :disabled="retrying" :aria-busy="retrying" @click="retry()" x-text="retrying ? '다시 시도 중' : '다시 시도'"></button></section>
    </section>

</main>

<script type="module" src="/campus.ts"></script>
</body>
</html>
