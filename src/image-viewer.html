<!doctype html>
<html lang="ko" class="h-full overflow-hidden bg-app-bg">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="color-scheme" content="light"/>
    <link rel="stylesheet" href="ui.css"/>
    <link rel="license" href="assets/fonts/Pretendard-LICENSE.txt"/>
    <title>이미지 뷰어</title>
</head>
<body class="h-full overflow-hidden bg-app-bg">
<main id="image-viewer" class="fixed inset-0 overflow-hidden" aria-busy="true">
    <div
        id="image-fit-layer"
        class="invisible absolute left-1/2 top-1/2 origin-center will-change-transform"
    >
        <img
            id="viewer-image"
            class="block h-full w-full max-h-none max-w-none select-none"
            alt="이미지"
            draggable="false"
        />
    </div>
    <section
        id="image-viewer-loading"
        class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-center text-app-muted"
        role="status"
        aria-live="polite"
    >
        <span class="size-8 animate-spin rounded-full border-2 border-app-border border-t-app-accent" aria-hidden="true"></span>
        <p class="m-0 text-sm">이미지를 불러오는 중입니다.</p>
    </section>
    <section
        id="image-viewer-error"
        class="absolute inset-0 hidden flex-col items-center justify-center gap-3 p-6 text-center"
        role="alert"
    >
        <strong class="text-sm">이미지를 불러오지 못했습니다.</strong>
        <p class="m-0 text-xs text-app-muted">네트워크 연결을 확인한 후 다시 시도해 주세요.</p>
        <button
            id="image-viewer-retry"
            type="button"
            class="inline-flex min-h-8 items-center justify-center rounded-lg border border-app-border bg-app-surface px-3 py-1 text-xs font-semibold text-app-text transition-colors duration-200 hover:border-app-border-strong hover:bg-app-surface-subtle focus-visible:ring-4 focus-visible:ring-app-accent-soft"
        >
            다시 시도
        </button>
    </section>
</main>
<script type="module" src="/image-viewer.ts"></script>
</body>
</html>
