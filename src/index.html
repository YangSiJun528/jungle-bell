<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="color-scheme" content="light"/>
    <link rel="stylesheet" href="ui.css"/>
    <link rel="license" href="assets/fonts/Pretendard-LICENSE.txt"/>
    <title>Jungle Bell 설정</title>
</head>
<body class="h-screen bg-app-bg font-sans text-app-text" x-data="settings" @focus.window="onFocus()">
<main class="mx-auto flex min-h-full w-full flex-col">
    <header class="mb-4 flex min-h-12 items-center gap-2">
        <img src="assets/logo.png" alt="" class="size-12 flex-none rounded-lg object-cover"/>
        <hgroup class="min-w-0 flex-1">
            <h1 class="m-0 text-[22px] leading-[1.2] font-bold tracking-normal">설정</h1>
            <p class="mt-1 text-xs leading-[1.4] font-medium text-app-muted">Jungle Bell <span class="ml-1 font-mono text-app-faint tabular-nums" x-text="appVersion ? `v${appVersion}` : ''"></span></p>
        </hgroup>
    </header>

    <nav class="mb-4" aria-label="설정 분류">
        <ul class="m-0 inline-grid h-10 list-none grid-cols-2 items-center rounded-lg bg-app-control p-1 text-app-muted">
            <li><button type="button" class="relative z-20 inline-flex min-h-8 min-w-12 items-center justify-center rounded-lg border-0 bg-transparent px-2 py-1 text-xs font-semibold whitespace-nowrap transition-colors duration-200 hover:text-app-text focus-visible:ring-4 focus-visible:ring-app-accent-soft aria-[current=page]:bg-app-surface aria-[current=page]:text-app-accent aria-[current=page]:shadow-sm" :aria-current="activeTab === 'notification' ? 'page' : undefined" aria-controls="notification-settings" @click="selectTab('notification')">알림</button></li>
            <li><button type="button" class="relative z-20 inline-flex min-h-8 min-w-12 items-center justify-center rounded-lg border-0 bg-transparent px-2 py-1 text-xs font-semibold whitespace-nowrap transition-colors duration-200 hover:text-app-text focus-visible:ring-4 focus-visible:ring-app-accent-soft aria-[current=page]:bg-app-surface aria-[current=page]:text-app-accent aria-[current=page]:shadow-sm" :aria-current="activeTab === 'app' ? 'page' : undefined" aria-controls="app-settings" @click="selectTab('app')">앱</button></li>
        </ul>
    </nav>

    <section id="notification-settings" class="flex-1" x-show="activeTab === 'notification'" x-cloak>
        <fieldset class="attendance-notification m-0 min-w-0 border-0 p-0">
            <legend class="w-full p-0 text-base leading-[1.4] font-bold tracking-normal">이번 출석</legend>
            <label class="mt-2 flex min-h-12 w-full items-center justify-between gap-2 py-1">
                <span class="min-w-0 flex-1"><strong class="block text-sm leading-[1.35] font-semibold">이번 출석 알림</strong></span>
                <span class="relative inline-flex h-6 w-12 flex-none items-center">
                    <input class="peer sr-only" type="checkbox" :checked="attendanceNotificationEnabled"
                           :aria-describedby="skipAttendance ? 'attendance-notification-hint' : undefined"
                           @change="setAttendanceNotification($event.currentTarget.checked)"/>
                    <span class="h-6 w-12 rounded-full border border-app-border-strong bg-app-control transition-colors duration-200 peer-checked:border-app-accent peer-checked:bg-app-accent peer-focus-visible:ring-4 peer-focus-visible:ring-app-accent-soft peer-disabled:opacity-50" aria-hidden="true"></span>
                    <span class="pointer-events-none absolute left-1 size-4 rounded-full bg-app-overlay shadow-[inset_0_0_0_2px_var(--color-border)] transition-transform duration-200 ease-out peer-checked:translate-x-6 peer-disabled:opacity-50" aria-hidden="true"></span>
                </span>
            </label>
            <p id="attendance-notification-hint" class="mt-2 rounded-lg border border-app-divider bg-app-surface-subtle p-2 text-xs leading-6 text-app-muted" x-show="skipAttendance" x-cloak x-text="skipAttendanceHint"></p>
        </fieldset>

        <fieldset class="notification-schedule mt-4 m-0 min-w-0 border-0 p-0">
            <legend class="w-full p-0 text-base leading-[1.4] font-bold tracking-normal">알림 일정</legend>
            <section class="mt-2 py-1" aria-labelledby="start-notification-title">
                <label class="flex min-h-8 w-full items-center justify-between gap-2">
                    <span class="min-w-0 flex-1"><strong id="start-notification-title" class="block text-sm leading-[1.35] font-semibold">시작 출석 알림</strong></span>
                    <span class="relative inline-flex h-6 w-12 flex-none items-center"><input class="peer sr-only" type="checkbox" x-model="startNotification" @change="saveToggle('set_start_notification_enabled', 'startNotification')"/><span class="h-6 w-12 rounded-full border border-app-border-strong bg-app-control transition-colors duration-200 peer-checked:border-app-accent peer-checked:bg-app-accent peer-focus-visible:ring-4 peer-focus-visible:ring-app-accent-soft" aria-hidden="true"></span><span class="pointer-events-none absolute left-1 size-4 rounded-full bg-app-overlay shadow-[inset_0_0_0_2px_var(--color-border)] transition-transform duration-200 ease-out peer-checked:translate-x-6" aria-hidden="true"></span></span>
                </label>
                <div class="grid grid-cols-2 gap-2 pt-2" x-show="startNotification" x-cloak>
                    <div class="min-w-0"><span class="mb-1 block text-xs font-semibold text-app-muted">알림 시간대</span>
                        <div class="relative w-full" x-data="selectControl" x-effect="syncValue(notificationStart)" @click.outside="close()">
                            <select hidden x-ref="native" tabindex="-1" aria-hidden="true" x-model.number="notificationStart" @change="saveStartTime()" :disabled="!startNotification">
                                <option value="4">04:00 - 10:00</option><option value="5">05:00 - 10:00</option><option value="6">06:00 - 10:00</option><option value="7">07:00 - 10:00</option><option value="8">08:00 - 10:00</option><option value="9">09:00 - 10:00</option>
                            </select>
                            <button type="button" class="flex min-h-8 w-full items-center justify-between gap-2 rounded-lg border border-app-border bg-app-control px-2 py-1 text-left text-xs font-semibold whitespace-nowrap text-app-text transition-colors hover:border-app-border-strong active:scale-[.97] disabled:text-app-disabled disabled:opacity-50" role="combobox" aria-haspopup="listbox" x-ref="trigger" aria-label="시작 출석 알림 시간대" :aria-expanded="open" :aria-controls="listboxId" :disabled="!startNotification" @click="toggle()" @keydown="handleTriggerKey($event)"><span x-text="selectedLabel"></span><svg class="size-4 flex-none transition-transform" :class="{'rotate-180': open}" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                            <div class="absolute inset-x-0 top-full z-30 mt-1 grid gap-1 rounded-lg border border-app-border-strong bg-app-overlay p-1" x-show="open" x-cloak :id="listboxId" role="listbox" @keydown="handleOptionKey($event)"><template x-for="option in options" :key="option.value"><button type="button" class="min-h-8 rounded-lg border-0 bg-transparent p-2 text-left text-xs font-medium text-app-muted hover:bg-app-surface-subtle hover:text-app-text focus-visible:bg-app-surface-subtle aria-selected:bg-app-accent-soft aria-selected:font-bold aria-selected:text-app-accent" role="option" :data-value="option.value" :aria-selected="selectedValue === option.value" :disabled="option.disabled" @click="choose(option.value)" x-text="option.label"></button></template></div>
                        </div>
                    </div>
                    <div class="min-w-0"><span class="mb-1 block text-xs font-semibold text-app-muted">반복 간격</span>
                        <div class="relative w-full" x-data="selectControl" x-effect="syncValue(startInterval)" @click.outside="close()">
                            <select hidden x-ref="native" tabindex="-1" aria-hidden="true" x-model.number="startInterval" @change="saveStartInterval()" :disabled="!startNotification"><option value="1">1분</option><option value="3">3분</option><option value="5">5분</option><option value="10">10분</option><option value="15">15분</option><option value="30">30분</option></select>
                            <button type="button" class="flex min-h-8 w-full items-center justify-between gap-2 rounded-lg border border-app-border bg-app-control px-2 py-1 text-left text-xs font-semibold whitespace-nowrap text-app-text transition-colors hover:border-app-border-strong active:scale-[.97] disabled:text-app-disabled disabled:opacity-50" role="combobox" aria-haspopup="listbox" x-ref="trigger" aria-label="시작 출석 알림 반복 간격" :aria-expanded="open" :aria-controls="listboxId" :disabled="!startNotification" @click="toggle()" @keydown="handleTriggerKey($event)"><span x-text="selectedLabel"></span><svg class="size-4 flex-none transition-transform" :class="{'rotate-180': open}" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                            <div class="absolute inset-x-0 top-full z-30 mt-1 grid gap-1 rounded-lg border border-app-border-strong bg-app-overlay p-1" x-show="open" x-cloak :id="listboxId" role="listbox" @keydown="handleOptionKey($event)"><template x-for="option in options" :key="option.value"><button type="button" class="min-h-8 rounded-lg border-0 bg-transparent p-2 text-left text-xs font-medium text-app-muted hover:bg-app-surface-subtle hover:text-app-text focus-visible:bg-app-surface-subtle aria-selected:bg-app-accent-soft aria-selected:font-bold aria-selected:text-app-accent" role="option" :data-value="option.value" :aria-selected="selectedValue === option.value" :disabled="option.disabled" @click="choose(option.value)" x-text="option.label"></button></template></div>
                        </div>
                    </div>
                </div>
                <p class="mt-2 text-xs leading-[1.45] text-app-muted" x-show="startNotification" x-cloak>10:00까지 체크인하지 않으면 이후에도 알림이 계속됩니다.</p>
            </section>

            <section class="mt-2 border-t border-app-divider pt-2" aria-labelledby="end-notification-title">
                <label class="flex min-h-8 w-full items-center justify-between gap-2">
                    <span class="min-w-0 flex-1"><strong id="end-notification-title" class="block text-sm leading-[1.35] font-semibold">종료 출석 알림</strong></span>
                    <span class="relative inline-flex h-6 w-12 flex-none items-center"><input class="peer sr-only" type="checkbox" x-model="endNotification" @change="saveToggle('set_end_notification_enabled', 'endNotification')"/><span class="h-6 w-12 rounded-full border border-app-border-strong bg-app-control transition-colors duration-200 peer-checked:border-app-accent peer-checked:bg-app-accent peer-focus-visible:ring-4 peer-focus-visible:ring-app-accent-soft" aria-hidden="true"></span><span class="pointer-events-none absolute left-1 size-4 rounded-full bg-app-overlay shadow-[inset_0_0_0_2px_var(--color-border)] transition-transform duration-200 ease-out peer-checked:translate-x-6" aria-hidden="true"></span></span>
                </label>
                <div class="grid grid-cols-2 gap-2 pt-2" x-show="endNotification" x-cloak>
                    <div class="min-w-0"><span class="mb-1 block text-xs font-semibold text-app-muted">알림 시간대</span>
                        <div class="relative w-full" x-data="selectControl" x-effect="syncValue(notificationEnd)" @click.outside="close()">
                            <select hidden x-ref="native" tabindex="-1" aria-hidden="true" x-model.number="notificationEnd" @change="saveEndTime()" :disabled="!endNotification"><option value="0">23:00 - 00:00</option><option value="1">23:00 - 01:00</option><option value="2">23:00 - 02:00</option><option value="3">23:00 - 03:00</option><option value="4">23:00 - 04:00</option></select>
                            <button type="button" class="flex min-h-8 w-full items-center justify-between gap-2 rounded-lg border border-app-border bg-app-control px-2 py-1 text-left text-xs font-semibold whitespace-nowrap text-app-text transition-colors hover:border-app-border-strong active:scale-[.97] disabled:text-app-disabled disabled:opacity-50" role="combobox" aria-haspopup="listbox" x-ref="trigger" aria-label="종료 출석 알림 시간대" :aria-expanded="open" :aria-controls="listboxId" :disabled="!endNotification" @click="toggle()" @keydown="handleTriggerKey($event)"><span x-text="selectedLabel"></span><svg class="size-4 flex-none transition-transform" :class="{'rotate-180': open}" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                            <div class="absolute inset-x-0 top-full z-30 mt-1 grid gap-1 rounded-lg border border-app-border-strong bg-app-overlay p-1" x-show="open" x-cloak :id="listboxId" role="listbox" @keydown="handleOptionKey($event)"><template x-for="option in options" :key="option.value"><button type="button" class="min-h-8 rounded-lg border-0 bg-transparent p-2 text-left text-xs font-medium text-app-muted hover:bg-app-surface-subtle hover:text-app-text focus-visible:bg-app-surface-subtle aria-selected:bg-app-accent-soft aria-selected:font-bold aria-selected:text-app-accent" role="option" :data-value="option.value" :aria-selected="selectedValue === option.value" :disabled="option.disabled" @click="choose(option.value)" x-text="option.label"></button></template></div>
                        </div>
                    </div>
                    <div class="min-w-0"><span class="mb-1 block text-xs font-semibold text-app-muted">반복 간격</span>
                        <div class="relative w-full" x-data="selectControl" x-effect="syncValue(endInterval)" @click.outside="close()">
                            <select hidden x-ref="native" tabindex="-1" aria-hidden="true" x-model.number="endInterval" @change="saveEndInterval()" :disabled="!endNotification"><option value="1">1분</option><option value="3">3분</option><option value="5">5분</option><option value="10">10분</option><option value="15">15분</option><option value="30">30분</option></select>
                            <button type="button" class="flex min-h-8 w-full items-center justify-between gap-2 rounded-lg border border-app-border bg-app-control px-2 py-1 text-left text-xs font-semibold whitespace-nowrap text-app-text transition-colors hover:border-app-border-strong active:scale-[.97] disabled:text-app-disabled disabled:opacity-50" role="combobox" aria-haspopup="listbox" x-ref="trigger" aria-label="종료 출석 알림 반복 간격" :aria-expanded="open" :aria-controls="listboxId" :disabled="!endNotification" @click="toggle()" @keydown="handleTriggerKey($event)"><span x-text="selectedLabel"></span><svg class="size-4 flex-none transition-transform" :class="{'rotate-180': open}" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                            <div class="absolute inset-x-0 top-full z-30 mt-1 grid gap-1 rounded-lg border border-app-border-strong bg-app-overlay p-1" x-show="open" x-cloak :id="listboxId" role="listbox" @keydown="handleOptionKey($event)"><template x-for="option in options" :key="option.value"><button type="button" class="min-h-8 rounded-lg border-0 bg-transparent p-2 text-left text-xs font-medium text-app-muted hover:bg-app-surface-subtle hover:text-app-text focus-visible:bg-app-surface-subtle aria-selected:bg-app-accent-soft aria-selected:font-bold aria-selected:text-app-accent" role="option" :data-value="option.value" :aria-selected="selectedValue === option.value" :disabled="option.disabled" @click="choose(option.value)" x-text="option.label"></button></template></div>
                        </div>
                    </div>
                </div>
            </section>
            <label class="mt-2 flex min-h-12 w-full items-center justify-between gap-2 border-t border-app-divider py-2"><span class="min-w-0 flex-1"><strong class="block text-sm leading-[1.35] font-semibold">일요일에는 알림 보내지 않기</strong></span><span class="relative inline-flex h-6 w-12 flex-none items-center"><input class="peer sr-only" type="checkbox" x-model="skipSunday" @change="saveToggle('set_skip_sunday', 'skipSunday')"/><span class="h-6 w-12 rounded-full border border-app-border-strong bg-app-control transition-colors duration-200 peer-checked:border-app-accent peer-checked:bg-app-accent peer-focus-visible:ring-4 peer-focus-visible:ring-app-accent-soft" aria-hidden="true"></span><span class="pointer-events-none absolute left-1 size-4 rounded-full bg-app-overlay shadow-[inset_0_0_0_2px_var(--color-border)] transition-transform duration-200 ease-out peer-checked:translate-x-6" aria-hidden="true"></span></span></label>
        </fieldset>

        <footer class="notification-actions mt-2 flex justify-start"><button type="button" class="inline-flex min-h-8 items-center justify-center rounded-lg border-0 bg-transparent px-2 py-1 text-xs font-semibold text-app-accent transition-colors duration-200 hover:bg-app-accent-soft hover:text-app-accent-hover focus-visible:ring-4 focus-visible:ring-app-accent-soft disabled:pointer-events-none disabled:opacity-50" @click="openNotificationSettings()">시스템 알림 설정</button></footer>
    </section>

    <section id="app-settings" class="flex-1" x-show="activeTab === 'app'" x-cloak>
        <fieldset class="m-0 min-w-0 border-0 p-0"><legend class="w-full p-0 text-base font-bold tracking-normal">앱 실행</legend><label class="mt-2 flex min-h-12 w-full items-center justify-between gap-2 py-1"><span class="min-w-0 flex-1"><strong class="block text-sm font-semibold">자동 시작</strong></span><span class="relative inline-flex h-6 w-12 flex-none items-center"><input class="peer sr-only" type="checkbox" x-model="autoStart" @change="saveToggle('set_auto_start', 'autoStart')"/><span class="h-6 w-12 rounded-full border border-app-border-strong bg-app-control transition-colors duration-200 peer-checked:border-app-accent peer-checked:bg-app-accent peer-focus-visible:ring-4 peer-focus-visible:ring-app-accent-soft" aria-hidden="true"></span><span class="pointer-events-none absolute left-1 size-4 rounded-full bg-app-overlay shadow-[inset_0_0_0_2px_var(--color-border)] transition-transform duration-200 ease-out peer-checked:translate-x-6" aria-hidden="true"></span></span></label></fieldset>
        <fieldset class="mt-4 m-0 min-w-0 border-0 p-0">
            <legend class="w-full p-0 text-base font-bold tracking-normal">화면</legend>
            <label class="mt-2 flex min-h-12 w-full items-center justify-between gap-2 py-1"><span class="min-w-0 flex-1"><strong class="block text-sm font-semibold">앱 아이콘 표시</strong><small class="mt-1 block text-xs leading-[1.45] text-app-muted">Dock 또는 작업 표시줄에 앱 아이콘을 표시합니다.</small></span><span class="relative inline-flex h-6 w-12 flex-none items-center"><input class="peer sr-only" type="checkbox" x-model="showAppIcon" @change="saveToggle('set_show_app_icon', 'showAppIcon')"/><span class="h-6 w-12 rounded-full border border-app-border-strong bg-app-control transition-colors duration-200 peer-checked:border-app-accent peer-checked:bg-app-accent peer-focus-visible:ring-4 peer-focus-visible:ring-app-accent-soft" aria-hidden="true"></span><span class="pointer-events-none absolute left-1 size-4 rounded-full bg-app-overlay shadow-[inset_0_0_0_2px_var(--color-border)] transition-transform duration-200 ease-out peer-checked:translate-x-6" aria-hidden="true"></span></span></label>
            <label class="flex min-h-12 w-full items-center justify-between gap-2 border-t border-app-divider py-1"><span class="min-w-0 flex-1"><strong class="block text-sm font-semibold">D-Day 표시</strong><small class="mt-1 block text-xs leading-[1.45] text-app-muted">트레이 패널에 남은 날짜를 표시합니다.</small></span><span class="relative inline-flex h-6 w-12 flex-none items-center"><input class="peer sr-only" type="checkbox" x-model="showDday" @change="saveToggle('set_show_dday', 'showDday')"/><span class="h-6 w-12 rounded-full border border-app-border-strong bg-app-control transition-colors duration-200 peer-checked:border-app-accent peer-checked:bg-app-accent peer-focus-visible:ring-4 peer-focus-visible:ring-app-accent-soft" aria-hidden="true"></span><span class="pointer-events-none absolute left-1 size-4 rounded-full bg-app-overlay shadow-[inset_0_0_0_2px_var(--color-border)] transition-transform duration-200 ease-out peer-checked:translate-x-6" aria-hidden="true"></span></span></label>
        </fieldset>
        <fieldset class="mt-4 m-0 min-w-0 border-0 p-0"><legend class="w-full p-0 text-base font-bold tracking-normal">개인정보</legend><label class="mt-2 flex min-h-12 w-full items-center justify-between gap-2 py-1"><span class="min-w-0 flex-1"><strong class="block text-sm font-semibold">사용 통계</strong><small class="mt-1 block text-xs leading-[1.45] text-app-muted">앱 기능 사용 기록을 서비스 개선에 사용합니다.</small></span><span class="relative inline-flex h-6 w-12 flex-none items-center"><input class="peer sr-only" type="checkbox" x-model="usageAnalytics" @change="saveToggle('set_usage_analytics_enabled', 'usageAnalytics')"/><span class="h-6 w-12 rounded-full border border-app-border-strong bg-app-control transition-colors duration-200 peer-checked:border-app-accent peer-checked:bg-app-accent peer-focus-visible:ring-4 peer-focus-visible:ring-app-accent-soft" aria-hidden="true"></span><span class="pointer-events-none absolute left-1 size-4 rounded-full bg-app-overlay shadow-[inset_0_0_0_2px_var(--color-border)] transition-transform duration-200 ease-out peer-checked:translate-x-6" aria-hidden="true"></span></span></label></fieldset>

        <section class="mt-4" aria-labelledby="support-links-title">
            <h2 id="support-links-title" class="m-0 text-base font-bold tracking-normal">문의</h2>
            <nav class="mt-2 grid grid-cols-3 gap-2" aria-label="공개 문의">
                <a class="inline-flex min-h-12 items-center justify-center rounded-lg border border-app-border bg-app-surface px-2 py-2 text-center text-xs font-semibold text-app-text transition-colors hover:border-app-border-strong hover:bg-app-surface-subtle focus-visible:ring-4 focus-visible:ring-app-accent-soft" href="https://github.com/YangSiJun528/jungle-bell/discussions/new?category=%EA%B6%81%EA%B8%88%ED%95%B4%EC%9A%94" target="_blank" rel="noopener noreferrer">궁금해요</a>
                <a class="inline-flex min-h-12 items-center justify-center rounded-lg border border-app-border bg-app-surface px-2 py-2 text-center text-xs font-semibold text-app-text transition-colors hover:border-app-border-strong hover:bg-app-surface-subtle focus-visible:ring-4 focus-visible:ring-app-accent-soft" href="https://github.com/YangSiJun528/jungle-bell/discussions/new?category=%EA%B1%B4%EC%9D%98%ED%95%98%EA%B8%B0" target="_blank" rel="noopener noreferrer">건의하기</a>
                <a class="inline-flex min-h-12 items-center justify-center rounded-lg border border-app-border bg-app-surface px-2 py-2 text-center text-xs font-semibold text-app-text transition-colors hover:border-app-border-strong hover:bg-app-surface-subtle focus-visible:ring-4 focus-visible:ring-app-accent-soft" href="https://github.com/YangSiJun528/jungle-bell/issues/new?template=bug.yml" target="_blank" rel="noopener noreferrer">버그 제보</a>
            </nav>
