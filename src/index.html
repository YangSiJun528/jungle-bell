<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="styles.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Jungle Bell</title>
</head>
<body x-data="settings" @focus.window="onFocus()">
<div class="header">
    <img src="assets/logo.png" alt="Jungle Bell" class="logo"/>
    <div>
        <h1>Jungle Bell <small x-text="appVersion ? `v${appVersion}` : ''"></small></h1>
        <p>크래프톤 정글 출석 체크 리마인더</p>
    </div>
</div>

<div class="tabs" role="tablist" aria-label="설정 분류">
    <button class="tab-btn" :class="{active: activeTab === 'attendance'}" :aria-selected="activeTab === 'attendance'"
            @click="selectTab('attendance')">출석</button>
    <button class="tab-btn" :class="{active: activeTab === 'notification'}" :aria-selected="activeTab === 'notification'"
            @click="selectTab('notification')">알림</button>
    <button class="tab-btn" :class="{active: activeTab === 'app'}" :aria-selected="activeTab === 'app'"
            @click="selectTab('app')">앱</button>
</div>

<div class="tab-content" :class="{active: activeTab === 'attendance'}">
    <table>
        <tr><th>학습 시작</th><td>04:00 ~ 10:00</td></tr>
        <tr><th>학습 종료</th><td>23:00 ~ 04:00</td></tr>
        <tr class="gap-field"></tr>
        <tr class="gap-field"></tr>
        <tr>
            <th>이번 출석 알림 끄기</th>
            <td>
                <label class="toggle">
                    <input type="checkbox" x-model="skipAttendance"
                           @change="saveToggle('set_skip_attendance', 'skipAttendance')"/>
                    <span class="toggle-slider"></span>
                </label>
            </td>
        </tr>
        <tr x-show="skipAttendance" x-cloak>
            <td class="setting-hint" colspan="2" x-text="skipAttendanceHint"></td>
        </tr>
    </table>
</div>

<div class="tab-content" :class="{active: activeTab === 'notification'}">
    <table>
        <tr>
            <th>일요일 알림 끄기</th>
            <td>
                <label class="toggle">
                    <input type="checkbox" x-model="skipSunday" @change="saveToggle('set_skip_sunday', 'skipSunday')"/>
                    <span class="toggle-slider"></span>
                </label>
            </td>
        </tr>
        <tr class="gap-field"></tr>
        <tr>
            <th>시작 출석</th>
            <td>
                <label class="toggle">
                    <input type="checkbox" x-model="startNotification"
                           @change="saveToggle('set_start_notification_enabled', 'startNotification')"/>
                    <span class="toggle-slider"></span>
                </label>
            </td>
        </tr>
        <tr class="start-notif-field" :class="{disabled: !startNotification}">
            <th></th>
            <td>
                <div class="select-pills">
                    <div class="pill"><div class="pill-select-wrap">
                        <select x-model.number="notificationStart" @change="saveStartTime()" :disabled="!startNotification"
                                aria-label="시작 출석 시간 범위">
                            <option value="4">04:00 ~ 10:00</option><option value="5">05:00 ~ 10:00</option>
                            <option value="6">06:00 ~ 10:00</option><option value="7">07:00 ~ 10:00</option>
                            <option value="8">08:00 ~ 10:00</option><option value="9">09:00 ~ 10:00</option>
                        </select>
                    </div></div>
                    <div class="pill"><div class="pill-select-wrap">
                        <select x-model.number="startInterval" @change="saveStartInterval()" :disabled="!startNotification"
                                aria-label="시작 출석 알림 간격">
                            <option value="1">1분 간격</option><option value="3">3분 간격</option>
                            <option value="5">5분 간격</option><option value="10">10분 간격</option>
                            <option value="15">15분 간격</option><option value="30">30분 간격</option>
                        </select>
                    </div></div>
                </div>
            </td>
        </tr>
        <tr class="start-notif-field" :class="{disabled: !startNotification}">
            <td class="setting-hint" colspan="2">시작 체크를 하지 않으면 10:00 이후에도 알림이 발송됩니다.</td>
        </tr>
        <tr class="gap-field"></tr>
        <tr>
            <th>종료 출석</th>
            <td>
                <label class="toggle">
                    <input type="checkbox" x-model="endNotification"
                           @change="saveToggle('set_end_notification_enabled', 'endNotification')"/>
                    <span class="toggle-slider"></span>
                </label>
            </td>
        </tr>
        <tr class="end-notif-field" :class="{disabled: !endNotification}">
            <th></th>
            <td>
                <div class="select-pills">
                    <div class="pill"><div class="pill-select-wrap">
                        <select x-model.number="notificationEnd" @change="saveEndTime()" :disabled="!endNotification"
                                aria-label="종료 출석 시간 범위">
                            <option value="0">23:00 ~ 00:00</option><option value="1">23:00 ~ 01:00</option>
                            <option value="2">23:00 ~ 02:00</option><option value="3">23:00 ~ 03:00</option>
                            <option value="4">23:00 ~ 04:00</option>
                        </select>
                    </div></div>
                    <div class="pill"><div class="pill-select-wrap">
                        <select x-model.number="endInterval" @change="saveEndInterval()" :disabled="!endNotification"
                                aria-label="종료 출석 알림 간격">
                            <option value="1">1분 간격</option><option value="3">3분 간격</option>
                            <option value="5">5분 간격</option><option value="10">10분 간격</option>
                            <option value="15">15분 간격</option><option value="30">30분 간격</option>
                        </select>
                    </div></div>
                </div>
            </td>
        </tr>
        <tr class="gap-field"></tr>
        <tr><th>시스템 알림</th><td><button class="link-btn" @click="openNotificationSettings()">설정 열기</button></td></tr>
        <tr><td class="setting-hint" colspan="2">알림이 오지 않으면 시스템 설정에서 Jungle Bell을 허용해 주세요.</td></tr>
    </table>
</div>

<div class="tab-content" :class="{active: activeTab === 'app'}">
    <div class="update-banner" x-show="pendingVersion" x-cloak>
        <span x-text="pendingVersion ? `v${pendingVersion} 업데이트가 있습니다` : ''"></span>
        <button class="update-banner-btn" @click="command('check_and_notify_update')">지금 업데이트</button>
    </div>
    <table>
        <tr><th>자동 시작</th><td><label class="toggle"><input type="checkbox" x-model="autoStart" @change="saveToggle('set_auto_start', 'autoStart')"/><span class="toggle-slider"></span></label></td></tr>
        <tr><th>자동 업데이트</th><td><label class="toggle"><input type="checkbox" x-model="autoUpdate" @change="saveToggle('set_auto_update', 'autoUpdate')"/><span class="toggle-slider"></span></label></td></tr>
        <tr><th></th><td><button class="link-btn" @click="command('check_and_notify_update')">업데이트 확인</button></td></tr>
        <tr class="gap-field"></tr>
        <tr><th>사용 통계</th><td><label class="toggle"><input type="checkbox" x-model="usageAnalytics" @change="saveToggle('set_usage_analytics_enabled', 'usageAnalytics')"/><span class="toggle-slider"></span></label></td></tr>
        <tr><td class="setting-hint" colspan="2">개인적인 내용 없이 사용 통계만 보내요. 앱 개선에만 사용돼요.</td></tr>
        <tr class="gap-field"></tr>
        <tr><th>디버그 모드</th><td><label class="toggle"><input type="checkbox" x-model="debugMode" @change="toggleDebugMode()"/><span class="toggle-slider"></span></label></td></tr>
        <tr><th>로그 폴더</th><td><button class="link-btn" @click="command('open_log_folder')">열기</button></td></tr>
        <tr class="gap-field"></tr><tr class="gap-field"></tr>
        <tr><th>온보딩</th><td><button class="link-btn" @click="command('open_onboarding')">다시 보기</button></td></tr>
        <tr><th>D-Day 표시</th><td><label class="toggle"><input type="checkbox" x-model="showDday" @change="saveToggle('set_show_dday', 'showDday')"/><span class="toggle-slider"></span></label></td></tr>
    </table>
</div>

<footer class="footer-links">
    <a href="https://github.com/YangSiJun528/jungle-bell" target="_blank" rel="noopener noreferrer">GitHub</a><span> · </span>
    <a href="https://github.com/YangSiJun528/jungle-bell/releases" target="_blank" rel="noopener noreferrer">릴리즈</a><span> · </span>
    <a href="https://github.com/YangSiJun528/jungle-bell/issues/new/choose" target="_blank" rel="noopener noreferrer">버그/기능 제보</a>
</footer>

<script type="module" src="/settings.ts"></script>
</body>
</html>
