<!doctype html>
<html lang="ko" data-page-layout="bleed" class="h-full overflow-hidden bg-transparent">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="color-scheme" content="light"/>
    <title>Jungle Bell</title>
    <link rel="stylesheet" href="/ui.css"/>
</head>
<body class="h-full overflow-hidden bg-transparent p-2 font-sans text-app-text antialiased">
<main
    class="flex h-full flex-col overflow-hidden rounded-[20px] border border-app-border bg-app-bg shadow-none"
    x-data="trayPanel"
    @keydown.window.escape="menuOpen ? closeMenu() : hide()"
>
    <header class="flex h-14 flex-none items-center justify-between px-4">
        <div class="flex min-w-0 items-center gap-2.5">
            <img class="size-8 flex-none rounded-[10px] object-cover" src="assets/logo.png" alt=""/>
            <span class="min-w-0">
                <strong class="block truncate text-[15px] font-bold leading-tight">Jungle Bell</strong>
                <small class="mt-0.5 block text-[11px] leading-none text-app-faint" x-text="state.currentVersion ? `v${state.currentVersion}` : '불러오는 중'"></small>
            </span>
        </div>
        <div class="flex items-center gap-1">
            <div class="relative" @click.outside="closeMenu()">
                <button
                    type="button"
                    class="flex size-8 items-center justify-center rounded-full border-0 bg-transparent text-app-faint transition-colors hover:bg-app-surface-subtle hover:text-app-text focus-visible:ring-4 focus-visible:ring-app-accent-soft disabled:opacity-50"
                    aria-label="앱 메뉴"
                    aria-haspopup="menu"
                    :aria-expanded="menuOpen"
                    aria-controls="app-menu"
                    :disabled="busyAction !== null"
                    @click="toggleMenu()"
                >
                    <svg class="size-4" data-icon="nut" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m8 3.5-5 8.5 5 8.5h8l5-8.5-5-8.5H8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    </svg>
                </button>
                <!-- 숨겨진 WebView가 닫힘 전환의 중간 프레임을 보존하지 않도록 열기 전환만 사용한다. -->
                <div
                    id="app-menu"
                    data-ui="app-menu"
                    class="absolute top-full right-0 z-50 mt-1 w-52 overflow-hidden rounded-xl border border-app-border-strong bg-app-overlay p-1 shadow-lg"
                    role="menu"
                    x-show="menuOpen"
                    x-cloak
                    x-transition:enter="transition ease-out duration-150"
                    x-transition:enter-start="opacity-0 -translate-y-1 scale-95"
                    x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                >
                    <button type="button" class="flex min-h-9 w-full items-center justify-between gap-2 rounded-lg border-0 bg-transparent px-3 text-left text-xs font-medium text-app-text transition-colors hover:bg-app-surface-subtle focus-visible:bg-app-surface-subtle focus-visible:ring-0 disabled:opacity-50" role="menuitem" :disabled="busyAction !== null" @click="perform('check_update')">
                        <span>업데이트 확인</span>
                        <span class="flex-none text-[10px] font-bold text-app-accent" x-show="state.pendingUpdate" x-cloak>(업데이트 필요)</span>
                    </button>
                    <button type="button" class="flex min-h-9 w-full items-center rounded-lg border-0 bg-transparent px-3 text-left text-xs font-medium text-app-text transition-colors hover:bg-app-surface-subtle focus-visible:bg-app-surface-subtle focus-visible:ring-0 disabled:opacity-50" role="menuitem" :disabled="busyAction !== null" @click="perform('open_settings')">설정</button>
                    <button type="button" class="flex min-h-9 w-full items-center justify-between gap-2 rounded-lg border-0 bg-transparent px-3 text-left text-xs font-medium text-app-text transition-colors hover:bg-app-surface-subtle focus-visible:bg-app-surface-subtle focus-visible:ring-0 disabled:opacity-50" role="menuitem" :disabled="busyAction !== null" @click="perform('open_feedback')">
                        <span>피드백</span>
                        <svg class="size-3.5 text-app-faint" data-icon="external-link" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16 16 8m-5 0h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <div class="my-1 border-t border-app-divider" role="separator"></div>
                    <button type="button" class="flex min-h-9 w-full items-center rounded-lg border-0 bg-transparent px-3 text-left text-xs font-medium text-app-text transition-colors hover:bg-app-danger-soft hover:text-app-danger focus-visible:bg-app-danger-soft focus-visible:text-app-danger focus-visible:ring-0 disabled:opacity-50" role="menuitem" :disabled="busyAction !== null" @click="perform('quit')">종료</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="mb-3 flex h-10 flex-none items-stretch gap-5 border-b border-app-divider px-4" role="tablist" aria-label="트레이 패널">
        <button
            type="button"
            class="relative flex h-full items-center border-0 bg-transparent px-1 text-xs font-semibold transition-colors duration-200 after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 after:rounded-full after:content-[''] focus-visible:ring-4 focus-visible:ring-app-accent-soft"
            :class="activeTab === 'home' ? 'text-app-accent after:bg-app-accent' : 'text-app-muted after:bg-transparent hover:text-app-text'"
            role="tab"
            :aria-selected="activeTab === 'home'"
            @click="selectTab('home')"
        >홈</button>
        <button
            type="button"
            class="relative flex h-full items-center border-0 bg-transparent px-1 text-xs font-semibold transition-colors duration-200 after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 after:rounded-full after:content-[''] focus-visible:ring-4 focus-visible:ring-app-accent-soft"
            :class="activeTab === 'news' ? 'text-app-accent after:bg-app-accent' : 'text-app-muted after:bg-transparent hover:text-app-text'"
            role="tab"
            :aria-selected="activeTab === 'news'"
            @click="selectTab('news')"
        >소식</button>
    </nav>

    <section class="min-h-0 flex-1 overflow-y-auto px-4 pb-3" x-show="activeTab === 'home'">
        <button
            type="button"
            class="w-full rounded-2xl border p-4 text-left transition-[filter,transform] duration-200 hover:brightness-[.98] active:scale-[.99] focus-visible:ring-4 focus-visible:ring-app-accent-soft disabled:pointer-events-none disabled:opacity-50"
            data-ui="attendance-status"
            :class="{
                'border-app-border bg-app-surface-subtle': presentation.tone === 'neutral',
                'border-app-warning bg-app-warning-soft': presentation.tone === 'warning',
                'border-app-danger bg-app-danger-soft': presentation.tone === 'danger',
                'border-app-success bg-app-success-soft': presentation.tone === 'success',
                'border-app-accent bg-app-accent-soft': presentation.tone === 'accent'
            }"
            :aria-label="`${presentation.actionLabel ?? '출석 상태 확인'} — ${state.statusText}`"
            aria-live="polite"
            :disabled="busyAction !== null"
            @click="perform('open_attendance')"
        >
            <span class="flex items-center gap-3">
                <span
                    class="flex size-10 flex-none items-center justify-center rounded-xl"
                    :class="{
                        'bg-app-overlay text-app-faint': presentation.tone === 'neutral',
                        'bg-app-warning text-white': presentation.tone === 'warning',
                        'bg-app-danger text-white': presentation.tone === 'danger',
                        'bg-app-success text-white': presentation.tone === 'success',
                        'bg-app-accent text-white': presentation.tone === 'accent'
                    }"
                >
                    <svg class="size-5" viewBox="0 0 24 24" aria-hidden="true">
                        <path x-show="presentation.tone === 'success'" d="m6.5 12.5 3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path x-show="presentation.tone === 'danger' || presentation.tone === 'warning'" d="M12 8v5m0 3.5v.1M10.3 4.8 3.7 17a2 2 0 0 0 1.8 3h13a2 2 0 0 0 1.8-3L13.7 4.8a2 2 0 0 0-3.4 0Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path x-show="presentation.tone === 'neutral' || presentation.tone === 'accent'" d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5A8.5 8.5 0 0 0 12 3.5Zm0 4v5l3 1.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span class="min-w-0 flex-1">
                    <strong class="block text-[17px] font-bold leading-snug" x-text="statusTextParts.title"></strong>
                    <small class="mt-1 block text-xs font-medium leading-snug text-app-muted" x-show="statusTextParts.detail" x-text="statusTextParts.detail"></small>
                </span>
                <svg class="size-4 flex-none text-app-faint" data-icon="chevron-right" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
        </button>

        <aside
            class="mt-3 flex min-h-14 items-center gap-3 rounded-xl border border-app-border bg-app-surface px-3"
            data-ui="dday"
            x-show="state.ddayText"
            x-cloak
            aria-live="polite"
        >
            <span class="flex size-9 flex-none items-center justify-center rounded-[10px] bg-app-common-soft text-app-common">
                <svg class="size-5" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5v17m0-15h10l-2.5 3L17 12H7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="min-w-0 flex-1">
                <small class="block text-[10px] font-bold text-app-common">D-Day</small>
                <strong class="mt-0.5 block truncate text-sm" x-text="state.ddayText"></strong>
            </span>
        </aside>

        <section class="mt-4" aria-labelledby="campus-action-title">
            <h2 id="campus-action-title" class="mb-2 text-xs font-bold text-app-muted">생활 정보</h2>
            <div class="grid grid-cols-2 gap-2">
                <button
                    type="button"
                    class="min-h-20 rounded-xl border border-app-border bg-app-surface p-3 text-left transition-colors hover:border-app-border-strong hover:bg-app-surface-subtle focus-visible:ring-4 focus-visible:ring-app-accent-soft disabled:opacity-50"
                    :disabled="busyAction !== null"
                    @click="perform('open_laundry')"
                >
                    <span class="flex size-8 items-center justify-center rounded-lg bg-app-men-soft text-app-men"><svg class="size-[18px]" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h14v17H5v-17Zm3 3h.1M12 6.5h4M12 10a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                    <span class="mt-2 flex items-center justify-between gap-2">
                        <strong class="text-xs">워시타워</strong>
                        <svg class="size-3.5 flex-none text-app-faint" data-icon="chevron-right" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                </button>
                <button
                    type="button"
                    class="min-h-20 rounded-xl border border-app-border bg-app-surface p-3 text-left transition-colors hover:border-app-border-strong hover:bg-app-surface-subtle focus-visible:ring-4 focus-visible:ring-app-accent-soft disabled:opacity-50"
                    :disabled="busyAction !== null"
                    @click="perform('open_meals')"
                >
                    <span class="flex size-8 items-center justify-center rounded-lg bg-app-success-soft text-app-success"><svg class="size-[18px]" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v7m-2-7v5a2 2 0 0 0 4 0V3m-2 7v11m8-18v18m0-18c3 2 3 7 0 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                    <span class="mt-2 flex items-center justify-between gap-2">
                        <strong class="text-xs">오늘의 식단</strong>
                        <svg class="size-3.5 flex-none text-app-faint" data-icon="chevron-right" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                </button>
            </div>
        </section>

    </section>

    <section class="min-h-0 flex-1 overflow-y-auto px-4 pb-3" x-show="activeTab === 'news'" x-cloak>
        <section aria-labelledby="news-title">
            <h2 id="news-title" class="mb-2 text-xs font-bold text-app-muted">소식</h2>

            <article class="rounded-2xl border border-app-info bg-app-info-soft p-4" x-show="state.pendingUpdate" x-cloak>
                <div class="flex items-start gap-3">
                    <span class="flex size-9 flex-none items-center justify-center rounded-xl bg-app-info text-white">
                        <svg class="size-5" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </span>
                    <span class="min-w-0 flex-1">
                        <small class="block text-[10px] font-bold text-app-info">새 버전</small>
                        <strong class="mt-1 block text-sm" x-text="state.pendingUpdate ? `Jungle Bell v${state.pendingUpdate}` : ''"></strong>
                    </span>
                </div>
                <button
                    type="button"
                    class="mt-3 min-h-9 w-full rounded-lg border-0 bg-app-info px-3 text-xs font-semibold text-white transition-colors hover:bg-app-info-hover focus-visible:ring-4 focus-visible:ring-app-overlay disabled:opacity-50"
                    :disabled="busyAction !== null"
                    @click="perform('check_update')"
                >업데이트하기</button>
            </article>

            <p class="m-0 flex min-h-12 items-center gap-2 rounded-xl border border-app-border bg-app-surface px-3 text-xs font-medium text-app-muted"
               x-show="newsLoading">
                <svg class="size-4 flex-none text-app-info" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h12v15H6v-15Zm3 4h6m-6 3h6m-6 3h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                소식을 불러오는 중...
            </p>

            <p class="m-0 flex min-h-12 items-center gap-2 rounded-xl border border-app-danger bg-app-danger-soft px-3 text-xs font-medium text-app-danger"
               x-show="newsError && newsItems.length === 0 && !newsLoading"
               x-cloak>
                소식을 불러오지 못했어요
            </p>

            <div class="space-y-2" :class="state.pendingUpdate ? 'mt-2' : ''" x-show="newsItems.length > 0" x-cloak>
                <template x-for="item in newsItems" :key="item.id">
                    <button
                        type="button"
                        class="block w-full rounded-xl border border-app-border bg-app-surface p-3 text-left transition-colors hover:border-app-border-strong hover:bg-app-surface-subtle focus-visible:ring-4 focus-visible:ring-app-accent-soft"
                        @click="openNewsItem(item)"
                    >
                        <span class="flex items-center justify-between gap-2">
                            <small
                                class="rounded-md bg-app-info-soft px-1.5 py-0.5 text-[10px] font-bold text-app-info"
                                x-text="newsLabel(item)"
                            ></small>
                            <small class="text-[10px] text-app-faint" x-text="newsDate(item)"></small>
                        </span>
                        <strong class="mt-2 block text-sm leading-snug" x-text="item.title"></strong>
                        <span
                            class="mt-1 line-clamp-2 text-[11px] leading-relaxed text-app-muted"
                            x-show="newsSummary(item)"
                            x-text="newsSummary(item)"
                        ></span>
                    </button>
                </template>
            </div>

            <p class="m-0 flex min-h-12 items-center gap-2 rounded-xl border border-app-border bg-app-surface px-3 text-xs font-medium text-app-muted"
               x-show="!state.pendingUpdate && newsItems.length === 0 && !newsLoading && !newsError">
                <svg class="size-4 flex-none text-app-info" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h12v15H6v-15Zm3 4h6m-6 3h6m-6 3h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                등록된 소식이 없어요
            </p>

        </section>
    </section>

</main>
<script type="module" src="/tray-panel.ts"></script>
</body>
</html>
