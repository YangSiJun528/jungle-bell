[package]
name = "jungle-bell-desktop"
version = "0.5.0"
description = "Thin desktop shell for the Jungle Bell web application"
authors = ["Jungle Bell contributors"]
edition = "2021"
rust-version = "1.88"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
minisign-verify = "=0.2.5"
notify-rust = { version = "=4.18.0", features = ["preview-macos-un"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
tokio = { version = "=1.53.1", features = ["sync", "time"] }
uuid = { version = "=1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
