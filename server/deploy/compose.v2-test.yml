name: jungle-bell-v2-test

services:
  postgres:
    image: postgres:17-alpine
    container_name: jungle-bell-postgres-v2-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jungle_bell}
      POSTGRES_USER: ${POSTGRES_USER:-jungle_bell}
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
      TZ: Asia/Seoul
    secrets:
      - database-password
    volumes:
      - jungle-bell-postgres-v2-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
      target: api-runtime
      args:
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
    image: ${API_IMAGE:-jungle-bell-api:v2-test-local}
    container_name: jungle-bell-api-v2-test
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jungle_bell}
      DATABASE_USERNAME: ${POSTGRES_USER:-jungle_bell}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
    secrets:
      - database-password
      - pairing-secret
      - vapid-public-key
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M

  worker:
    build:
      context: ../..
      dockerfile: server/Dockerfile
      target: worker-runtime
      args:
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
    image: ${WORKER_IMAGE:-jungle-bell-worker:v2-test-local}
    container_name: jungle-bell-worker-v2-test
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jungle_bell}
      DATABASE_USERNAME: ${POSTGRES_USER:-jungle_bell}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      COLLECTORS_ENABLED: ${COLLECTORS_ENABLED:-true}
      LAUNDRY_SOURCE_URL: ${LAUNDRY_SOURCE_URL:?set LAUNDRY_SOURCE_URL}
      MEALS_PINNED_SOURCE_URL: ${MEALS_PINNED_SOURCE_URL:-https://pf.kakao.com/rocket-web/web/profiles/_xhzNjn/posts?includePinnedPost=true}
      MEALS_DEFAULT_SOURCE_URL: ${MEALS_DEFAULT_SOURCE_URL:-https://pf.kakao.com/rocket-web/web/profiles/_xhzNjn/posts}
    secrets:
      - database-password
      - pairing-secret
      - vapid-public-key
      - vapid-private-key
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: jungle-bell-tunnel-v2-test
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      api:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M

  quick-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: jungle-bell-quick-tunnel-v2-test
    restart: unless-stopped
    profiles: ["quick-tunnel"]
    depends_on:
      api:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://api:8080
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  jungle-bell-postgres-v2-test:

secrets:
  database-password:
    file: ${DATABASE_PASSWORD_FILE:?set DATABASE_PASSWORD_FILE}
  pairing-secret:
    file: ${PAIRING_SECRET_FILE:?set PAIRING_SECRET_FILE}
  vapid-public-key:
    file: ${VAPID_PUBLIC_KEY_FILE:?set VAPID_PUBLIC_KEY_FILE}
  vapid-private-key:
    file: ${VAPID_PRIVATE_KEY_FILE:?set VAPID_PRIVATE_KEY_FILE}
