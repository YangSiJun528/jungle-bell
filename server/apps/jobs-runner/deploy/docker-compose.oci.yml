# Preserve the project identity used when this file lived at the server root.
name: server

services:
  jobs:
    build:
      context: ../../..
      dockerfile: apps/jobs-runner/deploy/Dockerfile
    image: ${JOBS_IMAGE:-jungle-bell-jobs:latest}
    container_name: jungle-bell-jobs
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Seoul
      JUNGLE_BELL_ENVIRONMENT: production
      MEALS_EVERY_MINUTES: ${MEALS_EVERY_MINUTES:-5}
      JOBS_D1_GATEWAY_URL: ${JOBS_D1_GATEWAY_URL:?set JOBS_D1_GATEWAY_URL}
      JOBS_D1_GATEWAY_SECRET_FILE: /run/secrets/jobs_d1_gateway_secret
      D1_GATEWAY_TIMEOUT_MS: ${D1_GATEWAY_TIMEOUT_MS:-30000}
      D1_GATEWAY_RETRIES: ${D1_GATEWAY_RETRIES:-3}
      VAPID_PUBLIC_KEY_FILE: /run/secrets/vapid_public_key
      VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      VAPID_SUBJECT: ${VAPID_SUBJECT:?set VAPID_SUBJECT}
      LAUNDRY_URL: ${LAUNDRY_URL:?set LAUNDRY_URL}
      MEALS_INCLUDE_PINNED_URL: ${MEALS_INCLUDE_PINNED_URL:-https://pf.kakao.com/rocket-web/web/profiles/_xhzNjn/posts?includePinnedPost=true}
      MEALS_DEFAULT_URL: ${MEALS_DEFAULT_URL:-https://pf.kakao.com/rocket-web/web/profiles/_xhzNjn/posts}
      MEALS_PAGE_URL: ${MEALS_PAGE_URL:-https://pf.kakao.com/_xhzNjn/posts}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      REQUEST_RETRIES: ${REQUEST_RETRIES:-2}
      LG_RUN_STATES: ${LG_RUN_STATES:-}
    volumes:
      - ${JOBS_D1_GATEWAY_SECRET_FILE:?set JOBS_D1_GATEWAY_SECRET_FILE}:/run/secrets/jobs_d1_gateway_secret:ro
      - ${VAPID_PUBLIC_KEY_FILE:?set VAPID_PUBLIC_KEY_FILE}:/run/secrets/vapid_public_key:ro
      - ${VAPID_PRIVATE_KEY_FILE:?set VAPID_PRIVATE_KEY_FILE}:/run/secrets/vapid_private_key:ro
