spring:
  application:
    name: jungle-bell-api
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jungle_bell}
    username: ${DATABASE_USERNAME:jungle_bell}
    password: ${DATABASE_PASSWORD:${database-password:jungle_bell}}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX:10}
      minimum-idle: ${DATABASE_POOL_MIN:2}
      connection-timeout: 5000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

jungle-bell:
  public-base-url: ${PUBLIC_BASE_URL:http://127.0.0.1:8080}
  allowed-desktop-origins:
    - tauri://localhost
    - http://tauri.localhost
    - http://127.0.0.1:5173
  pairing-secret: ${PAIRING_SECRET:${pairing-secret:local-development-pairing-secret}}
  vapid-public-key: ${VAPID_PUBLIC_KEY:${vapid-public-key:}}
  vapid-private-key: ${VAPID_PRIVATE_KEY:${vapid-private-key:}}
  vapid-subject: ${VAPID_SUBJECT:}
  collectors:
    enabled: false
    laundry-url:
    meals-default-url:
    meals-pinned-url:
  usage:
    enabled: ${USAGE_METRICS_ENABLED:true}
    anonymous-hash-secret: ${USAGE_HASH_SECRET:${usage-hash-secret:local-development-usage-hash-secret}}
    zone-id: Asia/Seoul
    anonymous-retention-days: 2
    user-activity-retention-days: 7
    feature-retention-days: 30
    summary-retention-days: 730

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5p requestId=%X{requestId:--} jobRunId=%X{jobRunId:--} thread=%thread source=%class.%method - %msg%n%ex"
  level:
    root: INFO
    app.junglebell: ${JUNGLE_BELL_LOG_LEVEL:INFO}
