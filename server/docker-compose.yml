services:
  collector:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATA_DIR: /data
      LAUNDRY_URL: ${LAUNDRY_URL:-https://miracle-beautifully-onto-ser.trycloudflare.com/api/status}
      MEALS_INCLUDE_PINNED_URL: ${MEALS_INCLUDE_PINNED_URL:-https://pf.kakao.com/rocket-web/web/profiles/_xhzNjn/posts?includePinnedPost=true}
      MEALS_DEFAULT_URL: ${MEALS_DEFAULT_URL:-https://pf.kakao.com/rocket-web/web/profiles/_xhzNjn/posts}
      MEALS_PAGE_URL: ${MEALS_PAGE_URL:-https://pf.kakao.com/_xhzNjn/posts}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      REQUEST_RETRIES: ${REQUEST_RETRIES:-2}
      LG_RUN_STATES: ${LG_RUN_STATES:-}
    volumes:
      - ${LOCAL_DATA_DIR:-./data}:/data
