services:
  collector:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: jungle-bell-collector:latest
    container_name: jungle-bell-collector
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Seoul
      MEALS_EVERY_MINUTES: ${MEALS_EVERY_MINUTES:-5}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?set CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_D1_DATABASE_ID: ${CLOUDFLARE_D1_DATABASE_ID:?set CLOUDFLARE_D1_DATABASE_ID}
      CLOUDFLARE_D1_API_TOKEN_FILE: /run/secrets/cloudflare_d1_api_token
      CLOUDFLARE_API_TIMEOUT_MS: ${CLOUDFLARE_API_TIMEOUT_MS:-30000}
      CLOUDFLARE_API_RETRIES: ${CLOUDFLARE_API_RETRIES:-3}
      R2_BUCKET: ${R2_BUCKET:-jungle-bell-data}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID_FILE: /run/secrets/r2_access_key_id
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_secret_access_key
      LAUNDRY_URL: ${LAUNDRY_URL:-https://miracle-beautifully-onto-ser.trycloudflare.com/api/status}
      MEALS_INCLUDE_PINNED_URL: ${MEALS_INCLUDE_PINNED_URL:-https://pf.kakao.com/rocket-web/web/profiles/_xhzNjn/posts?includePinnedPost=true}
      MEALS_DEFAULT_URL: ${MEALS_DEFAULT_URL:-https://pf.kakao.com/rocket-web/web/profiles/_xhzNjn/posts}
      MEALS_PAGE_URL: ${MEALS_PAGE_URL:-https://pf.kakao.com/_xhzNjn/posts}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      REQUEST_RETRIES: ${REQUEST_RETRIES:-2}
      LG_RUN_STATES: ${LG_RUN_STATES:-}
    volumes:
      - ${CLOUDFLARE_D1_API_TOKEN_FILE:?set CLOUDFLARE_D1_API_TOKEN_FILE}:/run/secrets/cloudflare_d1_api_token:ro
      - ${R2_ACCESS_KEY_ID_FILE:?set R2_ACCESS_KEY_ID_FILE}:/run/secrets/r2_access_key_id:ro
      - ${R2_SECRET_ACCESS_KEY_FILE:?set R2_SECRET_ACCESS_KEY_FILE}:/run/secrets/r2_secret_access_key:ro
